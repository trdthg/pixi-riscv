name: Build recipes

# this is important for trusted publishing
permissions:
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recipe:
        description: "Recipe name or path to build, for example 'mimick' or 'recipes/mimick'. Leave empty to build all recipes."
        required: false
        type: string
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: linux-riscv64, os: k1 }
      fail-fast: false

    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use pre-installed pixi now
      # - uses: prefix-dev/setup-pixi@v0.9.4
      #   with:
      #     pixi-version: v0.68.0

      - name: Select recipes
        id: recipes
        shell: bash
        run: |
          set -euo pipefail

          recipe_input="${{ github.event.inputs.recipe || '' }}"
          if [ -n "$recipe_input" ]; then
            recipe_input="${recipe_input#recipes/}"
            recipe_input="${recipe_input%/}"
            if [ "$recipe_input" = "all" ]; then
              find recipes -mindepth 2 -maxdepth 2 -name recipe.yaml -printf '%h\n' | sort > /tmp/recipes-to-build
            elif [ -f "recipes/${recipe_input}/recipe.yaml" ]; then
              printf 'recipes/%s\n' "$recipe_input" > /tmp/recipes-to-build
            else
              echo "Unknown recipe: $recipe_input"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | awk -F/ '/^recipes\/[^/]+\// { print $1 "/" $2 }' | sort -u > /tmp/recipes-to-build
          elif [ "${{ github.event_name }}" = "push" ]; then
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} | awk -F/ '/^recipes\/[^/]+\// { print $1 "/" $2 }' | sort -u > /tmp/recipes-to-build
          else
            find recipes -mindepth 2 -maxdepth 2 -name recipe.yaml -printf '%h\n' | sort > /tmp/recipes-to-build
          fi

          if [ ! -s /tmp/recipes-to-build ]; then
            echo "No changed recipes to build."
            echo "has_recipes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          order = {
              'recipes/builtin-interfaces': 400,
              'recipes/unique-identifier-msgs': 410,
              'recipes/std-msgs': 420,
              'recipes/geometry-msgs': 430,
              'recipes/action-msgs': 440,
              'recipes/rmw-implementation-cmake': 500,
              'recipes/rmw': 510,
              'recipes/rmw-implementation': 520,
              'recipes/rmw-dds-common': 530,
              'recipes/rosidl-typesupport-introspection-c': 540,
              'recipes/rosidl-typesupport-introspection-cpp': 550,
              'recipes/fastcdr': 560,
              'recipes/foonathan-memory': 570,
              'recipes/asio': 580,
              'recipes/tinyxml2': 590,
              'recipes/patchelf': 595,
              'recipes/fastrtps': 600,
              'recipes/fastrtps-cmake-module': 610,
              'recipes/rosidl-typesupport-fastrtps-cpp': 620,
              'recipes/rosidl-typesupport-fastrtps-c': 630,
              'recipes/rmw-fastrtps-shared-cpp': 640,
          }
          recipes = Path('/tmp/recipes-to-build').read_text().splitlines()
          recipes = sorted(recipes, key=lambda item: (order.get(item, 10000), item))
          Path('/tmp/recipes-to-build').write_text(''.join(f'{item}\n' for item in recipes))
          PY

          echo "Selected recipes:"
          cat /tmp/recipes-to-build
          echo "has_recipes=true" >> "$GITHUB_OUTPUT"

      - name: Build selected recipes
        if: steps.recipes.outputs.has_recipes == 'true'
        shell: bash
        run: |
          rm -rf output
          while IFS= read -r recipe_dir; do
            rattler-build build --recipe-dir "$recipe_dir" \
              --target-platform=${{ matrix.target }} \
              --channel="file://${PWD}/output" \
              --channel="https://prefix.dev/riscv" \
              --channel=conda-forge
          done < /tmp/recipes-to-build

      - name: Upload all packages
        shell: bash
        # do not upload on PR
        if: github.event_name != 'pull_request' && steps.recipes.outputs.has_recipes == 'true'
        run: |
          # uses trusted publishers for the upload
          for file in output/**/*.conda; do
            rattler-build upload prefix -c riscv "$file"
          done
