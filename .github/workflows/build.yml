name: Build recipes

# this is important for trusted publishing
permissions:
  id-token: write

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: "Single recipe name or path to build, for example 'mimick' or 'recipes/mimick'."
        required: true
        type: string

jobs:
  build:
    timeout-minutes: 720
    strategy:
      matrix:
        include:
          - { target: linux-riscv64, os: k1 }
      fail-fast: false

    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      # Use pre-installed pixi now
      # - uses: prefix-dev/setup-pixi@v0.9.4
      #   with:
      #     pixi-version: v0.68.0

      - name: Build recipe
        shell: bash
        run: |
          recipe="${{ github.event.inputs.recipe }}"
          recipe="${recipe#recipes/}"
          recipe="${recipe%/}"
          test -f "recipes/$recipe/recipe.yaml"
          rm -rf output
          rattler-build build --recipe-dir "recipes/$recipe" \
            --target-platform=${{ matrix.target }} \
            --output-dir=output \
            --channel="https://prefix.dev/riscv" \
            --channel=conda-forge
          find output -type f -name '*.conda' -print -exec rattler-build upload prefix -c riscv {} \;
