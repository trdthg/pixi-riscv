context:
  name: "ament-cmake-core"
  version: "1.3.14"
  git_rev: "8289d61973f27e66930e0b656e67e12fa1d394cb"
  source_dir: "ament_cmake_core"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ament/ament_cmake.git
  rev: ${{ git_rev }}

build:
  number: 1
  script:
    - cd ${{ source_dir }}
    - mkdir -p "$PREFIX/share/ament_cmake_core/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - cp package.xml "$PREFIX/share/ament_cmake_core/package.xml"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/ament_cmake_core"
    - if [ -d cmake ]; then cp -R cmake "$PREFIX/share/ament_cmake_core/"; fi
    - for file in *-extras.cmake; do [ -f "$file" ] && cp "$file" "$PREFIX/share/ament_cmake_core/cmake/"; done
    - |
      cat > "$PREFIX/share/ament_cmake_core/cmake/ament_cmake_coreConfig.cmake" <<'EOF'
      get_filename_component(_ament_cmake_core_prefix "${CMAKE_CURRENT_LIST_DIR}/../../.." ABSOLUTE)
      find_package(Python3 REQUIRED COMPONENTS Interpreter)
      execute_process(
        COMMAND "${Python3_EXECUTABLE}" -c "import os, sysconfig; print(sysconfig.get_path('purelib', scheme='posix_prefix', vars={'base': r'${_ament_cmake_core_prefix}', 'platbase': r'${_ament_cmake_core_prefix}'}))"
        OUTPUT_VARIABLE _ament_cmake_core_pythonpath
        OUTPUT_STRIP_TRAILING_WHITESPACE
      )
      if(_ament_cmake_core_pythonpath)
        set(ENV{PYTHONPATH} "${_ament_cmake_core_pythonpath}:$ENV{PYTHONPATH}")
      endif()
      include("${CMAKE_CURRENT_LIST_DIR}/ament_cmake_core-extras.cmake")
      include("${CMAKE_CURRENT_LIST_DIR}/ament_cmake_environment-extras.cmake")
      include("${CMAKE_CURRENT_LIST_DIR}/ament_cmake_environment_hooks-extras.cmake")
      include("${CMAKE_CURRENT_LIST_DIR}/ament_cmake_index-extras.cmake")
      include("${CMAKE_CURRENT_LIST_DIR}/ament_cmake_package_templates-extras.cmake")
      include("${CMAKE_CURRENT_LIST_DIR}/ament_cmake_uninstall_target-extras.cmake")
      include("${CMAKE_CURRENT_LIST_DIR}/ament_cmake_symlink_install-extras.cmake")
      EOF

requirements:
  run:
    - ament-package

# future requirements:
#   build:
#     - cmake

tests:
  - script:
      - test -f $PREFIX/share/ament_cmake_core/package.xml
      - test -f $PREFIX/share/ament_index/resource_index/packages/ament_cmake_core
      - test -f $PREFIX/share/ament_cmake_core/cmake/ament_cmake_coreConfig.cmake
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_ament_cmake_core NONE)
        find_package(ament_cmake_core REQUIRED)
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX

about:
  homepage: https://github.com/ament/ament_cmake
  repository: https://github.com/ament/ament_cmake
  summary: CMake support package from ament_cmake (ament_cmake_core)
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
