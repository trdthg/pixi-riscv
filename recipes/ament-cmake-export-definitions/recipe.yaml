context:
  name: "ament-cmake-export-definitions"
  version: "1.3.14"
  git_rev: "8289d61973f27e66930e0b656e67e12fa1d394cb"
  source_dir: "ament_cmake_export_definitions"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ament/ament_cmake.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - cd ${{ source_dir }}
    - mkdir -p "$PREFIX/share/ament_cmake_export_definitions/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - cp package.xml "$PREFIX/share/ament_cmake_export_definitions/package.xml"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/ament_cmake_export_definitions"
    - if [ -d cmake ]; then cp -R cmake "$PREFIX/share/ament_cmake_export_definitions/"; fi
    - for file in *-extras.cmake; do [ -f "$file" ] && cp "$file" "$PREFIX/share/ament_cmake_export_definitions/cmake/"; done
    - |
      cat > "$PREFIX/share/ament_cmake_export_definitions/cmake/ament_cmake_export_definitionsConfig.cmake" <<'EOF'
      include("${CMAKE_CURRENT_LIST_DIR}/ament_cmake_export_definitions-extras.cmake")
      EOF

# requirements:
#   build:
#     - cmake

tests:
  - script:
      - test -f $PREFIX/share/ament_cmake_export_definitions/package.xml
      - test -f $PREFIX/share/ament_index/resource_index/packages/ament_cmake_export_definitions
      - test -f $PREFIX/share/ament_cmake_export_definitions/cmake/ament_cmake_export_definitionsConfig.cmake

about:
  homepage: https://github.com/ament/ament_cmake
  repository: https://github.com/ament/ament_cmake
  summary: CMake support package from ament_cmake (ament_cmake_export_definitions)
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
