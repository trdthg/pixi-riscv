context:
  name: "ament-cmake-gen-version-h"
  version: "1.3.14"
  git_rev: "8289d61973f27e66930e0b656e67e12fa1d394cb"
  source_dir: "ament_cmake_gen_version_h"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ament/ament_cmake.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - cd ${{ source_dir }}
    - mkdir -p "$PREFIX/share/ament_cmake_gen_version_h/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - cp package.xml "$PREFIX/share/ament_cmake_gen_version_h/package.xml"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/ament_cmake_gen_version_h"
    - cp -R cmake "$PREFIX/share/ament_cmake_gen_version_h/"
    - cp ament_cmake_gen_version_h-extras.cmake "$PREFIX/share/ament_cmake_gen_version_h/cmake/"
    - |
      cat > "$PREFIX/share/ament_cmake_gen_version_h/cmake/ament_cmake_gen_version_hConfig.cmake" <<'EOF'
      include("${CMAKE_CURRENT_LIST_DIR}/ament_cmake_gen_version_h-extras.cmake")
      EOF

# requirements:
#   build:
#     - cmake
#   run:
#     - ament-cmake-core

tests:
  - script:
      - test -f $PREFIX/share/ament_cmake_gen_version_h/package.xml
      - test -f $PREFIX/share/ament_index/resource_index/packages/ament_cmake_gen_version_h
      - test -f $PREFIX/share/ament_cmake_gen_version_h/cmake/ament_cmake_gen_version_hConfig.cmake
      - test -f $PREFIX/share/ament_cmake_gen_version_h/cmake/ament_generate_version_header.cmake

about:
  homepage: https://github.com/ament/ament_cmake
  repository: https://github.com/ament/ament_cmake
  summary: Generate a C header containing the package version
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
