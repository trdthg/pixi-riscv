context:
  name: "ament-cmake-ros"
  version: "0.10.0"
  git_rev: "60572fa1bec50b9e6fbe64e1b23640d21c15e9d0"
  source_dir: "ament_cmake_ros"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/ament_cmake_ros.git
  rev: ${{ git_rev }}

build:
  number: 1
  script:
    - cd ${{ source_dir }}
    - mkdir -p "$PREFIX/share/ament_cmake_ros/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - cp package.xml "$PREFIX/share/ament_cmake_ros/package.xml"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/ament_cmake_ros"
    - cp -R cmake "$PREFIX/share/ament_cmake_ros/"
    - cp ament_cmake_ros-extras.cmake.in "$PREFIX/share/ament_cmake_ros/cmake/ament_cmake_ros-extras.cmake"
    - |
      cat > "$PREFIX/share/ament_cmake_ros/cmake/ament_cmake_rosConfig.cmake" <<'EOF'
      include("${CMAKE_CURRENT_LIST_DIR}/ament_cmake_ros-extras.cmake")
      EOF

requirements:
  host:
    - ament-cmake
    - ament-cmake-gmock
    - ament-cmake-gtest
    - ament-cmake-pytest
  run:
    - ament-cmake
    - ament-cmake-gmock
    - ament-cmake-gtest
    - ament-cmake-pytest

# future requirements:
#   build:
#     - cmake
#   run:
#     - domain-coordinator

tests:
  - script:
      - test -f $PREFIX/share/ament_cmake_ros/package.xml
      - test -f $PREFIX/share/ament_index/resource_index/packages/ament_cmake_ros
      - test -f $PREFIX/share/ament_cmake_ros/cmake/ament_cmake_rosConfig.cmake
      - test -f $PREFIX/share/ament_cmake_ros/cmake/ament_add_ros_isolated_gtest.cmake
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_ament_cmake_ros NONE)
        find_package(ament_cmake_ros REQUIRED)
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX -DBUILD_TESTING=OFF

about:
  homepage: https://github.com/ros2/ament_cmake_ros
  repository: https://github.com/ros2/ament_cmake_ros
  summary: ROS-specific CMake bits in the ament build system
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
