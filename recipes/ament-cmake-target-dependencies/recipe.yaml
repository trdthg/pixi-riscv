context:
  name: "ament-cmake-target-dependencies"
  version: "1.3.14"
  git_rev: "8289d61973f27e66930e0b656e67e12fa1d394cb"
  source_dir: "ament_cmake_target_dependencies"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ament/ament_cmake.git
  rev: ${{ git_rev }}

build:
  number: 1
  script:
    - cd ${{ source_dir }}
    - mkdir -p "$PREFIX/share/ament_cmake_target_dependencies/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - cp package.xml "$PREFIX/share/ament_cmake_target_dependencies/package.xml"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/ament_cmake_target_dependencies"
    - if [ -d cmake ]; then cp -R cmake "$PREFIX/share/ament_cmake_target_dependencies/"; fi
    - for file in *-extras.cmake; do [ -f "$file" ] && cp "$file" "$PREFIX/share/ament_cmake_target_dependencies/cmake/"; done
    - |
      cat > "$PREFIX/share/ament_cmake_target_dependencies/cmake/ament_cmake_target_dependenciesConfig.cmake" <<'EOF'
      include_guard(GLOBAL)
      include("${CMAKE_CURRENT_LIST_DIR}/ament_cmake_target_dependencies-extras.cmake")
      EOF

requirements:
  host:
    - ament-cmake-core
    - ament-cmake-include-directories
    - ament-cmake-libraries
  run:
    - ament-cmake-core
    - ament-cmake-include-directories
    - ament-cmake-libraries

# future requirements:
#   build:
#     - cmake

tests:
  - script:
      - test -f $PREFIX/share/ament_cmake_target_dependencies/package.xml
      - test -f $PREFIX/share/ament_index/resource_index/packages/ament_cmake_target_dependencies
      - test -f $PREFIX/share/ament_cmake_target_dependencies/cmake/ament_cmake_target_dependenciesConfig.cmake
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_ament_cmake_target_dependencies NONE)
        find_package(ament_cmake_target_dependencies REQUIRED)
        if(NOT COMMAND ament_target_dependencies)
          message(FATAL_ERROR "ament_target_dependencies was not exported")
        endif()
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX

about:
  homepage: https://github.com/ament/ament_cmake
  repository: https://github.com/ament/ament_cmake
  summary: CMake support package from ament_cmake (ament_cmake_target_dependencies)
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
