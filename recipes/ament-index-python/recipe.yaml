context:
  name: "ament-index-python"
  version: "1.4.1"
  git_rev: "ae673e815cae9413cfbf4cab6e91a9c1c73c84ef"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ament/ament_index.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - cd ament_index_python
    - |
      SITE_PACKAGES=$(python3 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
    - mkdir -p "$SITE_PACKAGES" "$PREFIX/bin" "$PREFIX/share/ament_index_python/environment" "$PREFIX/share/ament_index/resource_index/packages"
    - cp -R ament_index_python "$SITE_PACKAGES/"
    - cp package.xml "$PREFIX/share/ament_index_python/package.xml"
    - cp completion/ament_index-argcomplete.bash "$PREFIX/share/ament_index_python/environment/ament_index-argcomplete.bash"
    - cp completion/ament_index-argcomplete.zsh "$PREFIX/share/ament_index_python/environment/ament_index-argcomplete.zsh"
    - cp resource/ament_index_python "$PREFIX/share/ament_index/resource_index/packages/ament_index_python"
    - |
      cat > "$PREFIX/bin/ament_index" <<'EOF'
      #!/usr/bin/env sh
      exec python3 -m ament_index_python.cli "$@"
      EOF
    - chmod +x "$PREFIX/bin/ament_index"

# requirements:
#   build:
#     - python
#   run:
#     - python

tests:
  - script:
      - |
        SITE_PACKAGES=$(python3 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
      - PYTHONPATH="$SITE_PACKAGES" python3 -c "import ament_index_python; print('ament_index_python ok')"
      - test -x $PREFIX/bin/ament_index
      - test -f $PREFIX/share/ament_index_python/package.xml
      - test -f $PREFIX/share/ament_index/resource_index/packages/ament_index_python

about:
  homepage: https://github.com/ament/ament_index
  repository: https://github.com/ament/ament_index
  summary: Python API to access the ament resource index
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
