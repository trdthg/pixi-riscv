context:
  name: "builtin-interfaces"
  ros_name: "builtin_interfaces"
  version: "1.2.2"
  git_rev: "8311af7fa573ee4ffd2504011a605cf321a1501b"
  source_dir: "builtin_interfaces"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rcl_interfaces.git
  rev: ${{ git_rev }}

build:
  number: 6
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$("$PREFIX/bin/python3.12" -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
      export PYTHONPATH="$SITE_PACKAGES${PYTHONPATH:+:$PYTHONPATH}"
    - $PREFIX/bin/cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPython3_EXECUTABLE="$PREFIX/bin/python3.12" -DPYTHON_EXECUTABLE="$PREFIX/bin/python3.12"
    - $PREFIX/bin/cmake --build build --target install -- -j"$(nproc)"
    - |
      "$PREFIX/bin/python3.12" - <<'PY'
      import os
      import re
      from pathlib import Path

      cmake_dir = Path(os.environ["PREFIX"]) / "share/builtin_interfaces/cmake"
      for path in cmake_dir.glob("*.cmake"):
          text = path.read_text()
          text = re.sub(r'INTERFACE_INCLUDE_DIRECTORIES\s+"[^"]*(?:host_env_placehold|/usr/lib|python3-numpy|numpy/_core/include|libpython3)[^"]*"', 'INTERFACE_INCLUDE_DIRECTORIES "${_IMPORT_PREFIX}/include/builtin_interfaces"', text)
          text = re.sub(r';?/usr/lib/riscv64-linux-gnu/libpython[^;"]*', '', text)
          path.write_text(text)
      PY

requirements:
  build:
    - cmake
    - patchelf
  host:
    - ament-cmake
    - numpy
    - python
    - rosidl-default-generators
    - setuptools
  run:
    - ament-cmake
    - numpy
    - python
    - rosidl-default-runtime

# This recipe intentionally uses host cmake and compiler on the native riscv runner.
# future requirements:
#   build:
#     - c-compiler
#     - cxx-compiler
#     - make
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/share/builtin_interfaces/msg/Time.msg
      - test -f $PREFIX/share/builtin_interfaces/msg/Time.idl
      - test -f $PREFIX/include/builtin_interfaces/builtin_interfaces/msg/time.h
      - test -f $PREFIX/include/builtin_interfaces/builtin_interfaces/msg/time.hpp
      - test -f $PREFIX/lib/libbuiltin_interfaces__rosidl_generator_c.so
      - test -f $PREFIX/lib/libbuiltin_interfaces__rosidl_typesupport_c.so
      - test -f $PREFIX/lib/libbuiltin_interfaces__rosidl_typesupport_cpp.so
      - test -f $PREFIX/share/ament_index/resource_index/packages/builtin_interfaces
      - test -f $PREFIX/share/ament_index/resource_index/rosidl_interfaces/builtin_interfaces
      - grep -q 'msg/Time.idl' $PREFIX/share/ament_index/resource_index/rosidl_interfaces/builtin_interfaces
      - |
        if grep -R -E 'host_env_placehold|/usr/lib|python3-numpy|numpy/_core/include|libpython3' "$PREFIX/share/builtin_interfaces/cmake"; then
          echo "builtin_interfaces CMake exports contain non-relocatable include paths"
          exit 1
        fi
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.16)
        project(test_builtin_interfaces C CXX)
        find_package(builtin_interfaces REQUIRED)
        if(NOT "msg/Time.idl" IN_LIST builtin_interfaces_IDL_FILES)
          message(FATAL_ERROR "missing Time.idl")
        endif()
        EOF
      - $PREFIX/bin/cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - |
        cat > test_builtin_interfaces.cpp <<'EOF'
        #include <builtin_interfaces/msg/time.hpp>
        int main() {
          builtin_interfaces::msg::Time msg;
          msg.sec = 1;
          msg.nanosec = 2u;
          return msg.sec == 1 && msg.nanosec == 2u ? 0 : 1;
        }
        EOF
      - c++ -std=c++14 -I$PREFIX/include -I$PREFIX/include/builtin_interfaces test_builtin_interfaces.cpp -o test_builtin_interfaces
      - ./test_builtin_interfaces

about:
  homepage: https://github.com/ros2/rcl_interfaces
  repository: https://github.com/ros2/rcl_interfaces
  summary: Primitive time and duration interfaces for ROS 2
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
