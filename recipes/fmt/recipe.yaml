context:
  name: "fmt"
  version: "10.1.1"
  sha256: "78b8c0a72b1c35e4443a7e308df52498252d1cefc2b08c9a97bc9ee6cfe61f8b"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/fmtlib/fmt/archive/refs/tags/${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 2
  script:
    - mkdir -p build
    - cd build
    - cmake .. -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DFMT_TEST=OFF -DFMT_DOC=OFF
    - cmake --build . --target install -- -j"$(nproc)"
    - mkdir -p "$PREFIX/share/ament_index/resource_index/packages"
    - printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/fmt"

requirements:
  host:
    - cmake

# This recipe intentionally uses the host compiler on the native riscv runner.
# Enable these dependencies once the riscv channel has compilers and libstdc++.
# requirements:
#   build:
#     - cxx-compiler
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/include/fmt/format.h
      - test -f $PREFIX/lib/cmake/fmt/fmt-config.cmake
      - |
        if ! ls "$PREFIX"/lib/libfmt.so* >/dev/null 2>&1; then
          echo "missing fmt shared library"
          exit 1
        fi
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_fmt CXX)
        find_package(fmt REQUIRED)
        add_executable(test_fmt test_fmt.cpp)
        target_link_libraries(test_fmt PRIVATE fmt::fmt)
        EOF
      - |
        cat > test_fmt.cpp <<'EOF'
        #include <fmt/format.h>
        int main() {
          return fmt::format("{}", 42) == "42" ? 0 : 1;
        }
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - cmake --build build
      - ./build/test_fmt

about:
  homepage: https://github.com/fmtlib/fmt
  repository: https://github.com/fmtlib/fmt
  summary: Open-source formatting library
  license: MIT

extra:
  recipe-maintainers:
    - trdthg
