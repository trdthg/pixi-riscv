context:
  name: "geometry-msgs"
  ros_name: "geometry_msgs"
  version: "4.9.1"
  git_rev: "c3072dba174f18d41b64fcbbb20bed47a86e9898"
  source_dir: "geometry_msgs"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/common_interfaces.git
  rev: ${{ git_rev }}

build:
  number: 3
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$("$PREFIX/bin/python3.12" -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
      export PYTHONPATH="$SITE_PACKAGES${PYTHONPATH:+:$PYTHONPATH}"
    - $PREFIX/bin/cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPython3_EXECUTABLE="$PREFIX/bin/python3.12" -DPYTHON_EXECUTABLE="$PREFIX/bin/python3.12"
    - $PREFIX/bin/cmake --build build --target install -- -j"$(nproc)"
    - |
      "$PREFIX/bin/python3.12" - <<'PY'
      import os
      import re
      from pathlib import Path

      cmake_dir = Path(os.environ["PREFIX"]) / "share/geometry_msgs/cmake"
      for path in cmake_dir.glob("*.cmake"):
          text = path.read_text()
          text = re.sub(r'INTERFACE_INCLUDE_DIRECTORIES\s+"[^"]*(?:host_env_placehold|/usr/lib|python3-numpy|numpy/_core/include|libpython3)[^"]*"', 'INTERFACE_INCLUDE_DIRECTORIES "${_IMPORT_PREFIX}/include/geometry_msgs"', text)
          text = re.sub(r';?/usr/lib/riscv64-linux-gnu/libpython[^;"]*', '', text)
          path.write_text(text)
      PY

requirements:
  build:
    - cmake
    - patchelf
  host:
    - ament-cmake
    - numpy
    - python
    - rosidl-default-generators
    - setuptools
    - std-msgs
  run:
    - ament-cmake
    - numpy
    - python
    - rosidl-default-runtime
    - std-msgs

# This recipe intentionally uses host cmake and compiler on the native riscv runner.
# future requirements:
#   build:
#     - c-compiler
#     - cxx-compiler
#     - make
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/share/${{ ros_name }}/msg/Twist.msg
      - test -f $PREFIX/share/${{ ros_name }}/msg/Twist.idl
      - test -f $PREFIX/share/${{ ros_name }}/msg/Vector3.msg
      - test -f $PREFIX/share/${{ ros_name }}/msg/Vector3.idl
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/twist.h
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/twist.hpp
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/vector3.h
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/vector3.hpp
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_generator_c.so
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_typesupport_c.so
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_typesupport_cpp.so
      - test -f $PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}
      - test -f $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - grep -q 'msg/Twist.idl' $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - |
        if grep -R -E 'host_env_placehold|/usr/lib|python3-numpy|numpy/_core/include|libpython3' "$PREFIX/share/${{ ros_name }}/cmake"; then
          echo "${{ ros_name }} CMake exports contain non-relocatable include paths"
          exit 1
        fi
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.16)
        project(test_geometry_msgs C CXX)
        find_package(geometry_msgs REQUIRED)
        if(NOT "msg/Twist.idl" IN_LIST geometry_msgs_IDL_FILES)
          message(FATAL_ERROR "missing Twist.idl")
        endif()
        EOF
      - $PREFIX/bin/cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - |
        cat > test_geometry_msgs.cpp <<'EOF'
        #include <geometry_msgs/msg/twist.hpp>
        int main() {
          geometry_msgs::msg::Twist msg;
          msg.linear.x = 1.0;
          msg.angular.z = -0.5;
          return msg.linear.x == 1.0 && msg.angular.z == -0.5 ? 0 : 1;
        }
        EOF
      - c++ -std=c++14 -I$PREFIX/include -I$PREFIX/include/geometry_msgs test_geometry_msgs.cpp -o test_geometry_msgs
      - ./test_geometry_msgs

about:
  homepage: https://github.com/ros2/common_interfaces
  repository: https://github.com/ros2/common_interfaces
  summary: Geometry message definitions for ROS 2
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
