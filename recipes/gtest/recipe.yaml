context:
  name: "gtest"
  version: "1.12.1"
  git_rev: "58d77fa8070e8cec2dc1ed015d66b454c8d78850"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/google/googletest.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_GMOCK=OFF -DINSTALL_GTEST=ON
    - cmake --build build --target install -- -j"$(nproc)"
    - mkdir -p "$PREFIX/share/gtest/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - |
      cat > "$PREFIX/share/gtest/cmake/gtestConfig.cmake" <<'EOF'
      find_package(GTest REQUIRED CONFIG)
      set(gtest_FOUND TRUE)
      set(gtest_LIBRARIES GTest::gtest)
      set(gtest_MAIN_LIBRARIES GTest::gtest_main)
      set(gtest_BOTH_LIBRARIES GTest::gtest GTest::gtest_main)
      get_target_property(gtest_INCLUDE_DIRS GTest::gtest INTERFACE_INCLUDE_DIRECTORIES)
      EOF
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/gtest"

requirements:
  build:
    - patchelf
    - ${{ compiler("cxx") }}
    - cmake
    - make

tests:
  - script:
      - test -f $PREFIX/lib/libgtest.so
      - test -f $PREFIX/lib/libgtest_main.so
      - test -f $PREFIX/lib/cmake/GTest/GTestConfig.cmake
      - test -f $PREFIX/share/gtest/cmake/gtestConfig.cmake
      - |
        cat > test_gtest.cpp <<'EOF'
        #include <gtest/gtest.h>
        TEST(Bootstrap, Basic) { EXPECT_EQ(1, 1); }
        EOF
      - $CXX -std=c++14 -I$PREFIX/include test_gtest.cpp -L$PREFIX/lib -lgtest -lgtest_main -pthread -Wl,-rpath,$PREFIX/lib -o test_gtest
      - ./test_gtest
    requirements:
      run:
        - gxx_linux-riscv64

about:
  homepage: https://github.com/google/googletest
  repository: https://github.com/google/googletest
  summary: GoogleTest C++ testing framework
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
