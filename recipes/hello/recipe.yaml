context:
  version: "0.1.0"
  name: "hello"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ./hello.c

build:
  number: 0
  script:
    - mkdir -p $PREFIX/bin
    - gcc -o $PREFIX/bin/hello hello.c

# requirements:
#   build:
#     - ${{ compiler("c") }}

tests:
  - script:
      - hello
