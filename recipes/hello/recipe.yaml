context:
  version: "0.1.0"
  name: "hello"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ./hello.c

build:
  number: 2
  script:
    - mkdir -p $PREFIX/bin
    - test -n "${CC:-}"
    - case "$CC" in */bin/riscv64-conda-linux-gnu-gcc) ;; *) echo "unexpected CC=$CC"; exit 1 ;; esac
    - $CC -o $PREFIX/bin/hello hello.c

requirements:
  build:
    - ${{ compiler("c") }}

tests:
  - script:
      - hello
      - $PREFIX/bin/riscv64-conda-linux-gnu-readelf -l "$(command -v hello)" | grep -q 'ld-linux-riscv64-lp64d.so.1'
    requirements:
      run:
        - binutils
