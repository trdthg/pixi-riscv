context:
  name: "m4"
  version: "1.4.19"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/m4/m4-${{ version }}.tar.xz
  sha256: 63aede5c6d33b6d9b13511cd0be2cac046f2e70fd0a07aa9573a04a82783af96

build:
  number: 0
  dynamic_linking:
    binary_relocation: false
  script:
    - ./configure --prefix="$PREFIX"
    - make -j"$(nproc)"
    - make install

# Bootstrap package: uses host compiler and make.
# future requirements:
#   build:
#     - c-compiler
#     - make

tests:
  - script:
      - test -x "$PREFIX/bin/m4"
      - $PREFIX/bin/m4 --version

about:
  homepage: https://www.gnu.org/software/m4/
  repository: https://git.savannah.gnu.org/cgit/m4.git
  summary: GNU macro processor
  license: GPL-3.0-or-later
  license_file: COPYING

extra:
  recipe-maintainers:
    - trdthg
