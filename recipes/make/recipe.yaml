context:
  name: "make"
  version: "4.4.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/make/make-${{ version }}.tar.gz
  sha256: dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3

build:
  number: 3
  dynamic_linking:
    binary_relocation: false
  script:
    - ./configure --prefix="$PREFIX"
    - make -j"$(nproc)"
    - make install

requirements:
  build:
    - ${{ compiler("c") }}

# Bootstrap package: still uses the host make executable to build GNU Make
# itself, but no longer uses the host compiler.

tests:
  - script:
      - test -x $PREFIX/bin/make
      - $PREFIX/bin/make --version
      - |
        mkdir make-include-test
        printf 'include inc.mk\nall:\n\t@echo "$(RESULT)"\n' > make-include-test/Makefile
        printf 'RESULT := include-ok\n' > make-include-test/inc.mk
        env | sort | grep -E '^(MAKE|MFLAGS|SHELL|POSIXLY_CORRECT)=' || true
        $PREFIX/bin/make --version
        od -An -tx1 -c make-include-test/Makefile
        cat -n make-include-test/Makefile
        $PREFIX/bin/make -C make-include-test --debug=v all
        $PREFIX/bin/make -C make-include-test all | grep -q include-ok

about:
  homepage: https://www.gnu.org/software/make/
  repository: https://git.savannah.gnu.org/cgit/make.git
  summary: GNU Make build automation tool
  license: GPL-3.0-or-later
  license_file: COPYING

extra:
  recipe-maintainers:
    - trdthg
