context:
  name: "mpc"
  version: "1.3.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/mpc/mpc-${{ version }}.tar.gz
  sha256: ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8

build:
  number: 0
  dynamic_linking:
    binary_relocation: false
  script:
    - ./configure --prefix="$PREFIX" --with-gmp="$PREFIX" --with-mpfr="$PREFIX" --disable-static
    - make -j"$(nproc)"
    - make install

requirements:
  host:
    - gmp
    - mpfr
  run:
    - gmp
    - mpfr
  build:
    - ${{ compiler("c") }}
    - make

tests:
  - script:
      - test -f "$PREFIX/include/mpc.h"
      - test -f "$PREFIX/lib/libmpc.so"

about:
  homepage: https://www.multiprecision.org/mpc/
  repository: https://gitlab.inria.fr/mpc/mpc
  summary: Multiple-precision complex arithmetic library
  license: LGPL-3.0-or-later
  license_file: COPYING.LESSER

extra:
  recipe-maintainers:
    - trdthg
