context:
  name: "numpy"
  version: "2.0.2"
  wheel_sha256: "f51a68e298c9481aa4afc565ad1a0da1f1e56211cb6fceb835291c17a4751891"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://gitlab.com/api/v4/projects/56254198/packages/pypi/files/${{ wheel_sha256 }}/numpy-${{ version }}-cp312-cp312-manylinux_2_35_riscv64.whl
  sha256: ${{ wheel_sha256 }}

build:
  number: 0
  script:
    - |
      if [ ! -d numpy ]; then
        wheel=$(find . -maxdepth 1 -name 'numpy-${{ version }}-*.whl' | head -n 1)
        "$PREFIX/bin/python3.12" - <<PY
      import pathlib
      import zipfile

      wheel = pathlib.Path("${wheel}")
      if not wheel.is_file():
          raise SystemExit("numpy wheel not found")
      zipfile.ZipFile(wheel).extractall(".")
      PY
      fi
    - |
      SITE_PACKAGES=$($PREFIX/bin/python3.12 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
    - mkdir -p "$SITE_PACKAGES"
    - cp -R numpy numpy.libs numpy-${{ version }}.dist-info "$SITE_PACKAGES/"

requirements:
  build:
    - patchelf
  host:
    - python
  run:
    - python

# Bootstrap package: this wraps a prebuilt RISC-V CPython 3.12 wheel so ROS
# message generation can use the packaged Python before we have a full native
# scientific Python build stack.
# future requirements:
#   build:
#     - c-compiler
#     - cxx-compiler
#     - meson-python
#     - ninja
#     - pkg-config
#   host:
#     - libblas
#     - liblapack
#   run:
#     - libblas
#     - libgfortran
#     - libstdcxx

tests:
  - script:
      - |
        $PREFIX/bin/python3.12 - <<'PY'
        import numpy
        import pathlib

        include_dir = pathlib.Path(numpy.get_include())
        assert include_dir.is_dir(), include_dir
        assert (include_dir / "numpy" / "ndarrayobject.h").is_file()
        data = numpy.array([1, 2, 3], dtype=numpy.int64)
        assert int(data.sum()) == 6
        print("numpy", numpy.__version__, include_dir)
        PY

about:
  homepage: https://numpy.org/
  repository: https://github.com/numpy/numpy
  summary: Fundamental package for array computing in Python
  license: BSD-3-Clause
  license_file: numpy-${{ version }}.dist-info/LICENSE.txt

extra:
  recipe-maintainers:
    - trdthg
