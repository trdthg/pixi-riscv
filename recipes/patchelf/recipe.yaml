context:
  name: "patchelf"
  version: "0.18.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/NixOS/patchelf/releases/download/${{ version }}/patchelf-${{ version }}.tar.bz2
  sha256: 1952b2a782ba576279c211ee942e341748fdb44997f704dd53def46cd055470b

build:
  number: 0
  dynamic_linking:
    binary_relocation: false
  script:
    - ./configure --prefix="$PREFIX"
    - make -j"$(nproc)"
    - make install

# It must not depend on patchelf for its own packaging bootstrap.
requirements:
  build:
    - ${{ compiler("cxx") }}
    - make

tests:
  - script:
      - test -x $PREFIX/bin/patchelf
      - $PREFIX/bin/patchelf --version

about:
  homepage: https://github.com/NixOS/patchelf
  repository: https://github.com/NixOS/patchelf
  summary: Small utility to modify the dynamic linker and RPATH of ELF executables
  license: GPL-3.0-or-later
  license_file: COPYING

extra:
  recipe-maintainers:
    - trdthg
