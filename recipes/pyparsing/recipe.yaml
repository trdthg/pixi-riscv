context:
  name: "pyparsing"
  version: "3.1.2"
  git_rev: "7d4bda2743ebc04f68d2594bc4fffc70cd65848f"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/pyparsing/pyparsing.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - |
      SITE_PACKAGES=$(python3 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
    - mkdir -p "$SITE_PACKAGES"
    - cp -R pyparsing "$SITE_PACKAGES/"
    - mkdir -p "$SITE_PACKAGES/pyparsing-${{ version }}.dist-info"
    - |
      cat > "$SITE_PACKAGES/pyparsing-${{ version }}.dist-info/METADATA" <<'EOF'
      Metadata-Version: 2.1
      Name: pyparsing
      Version: ${{ version }}
      Summary: Python parsing module
      EOF

# requirements:
#   build:
#     - python
#   run:
#     - python

tests:
  - script:
      - |
        SITE_PACKAGES=$(python3 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
      - PYTHONPATH="$SITE_PACKAGES" python3 -c "import pyparsing; assert pyparsing.__version__ == '${{ version }}'; print('pyparsing ok')"

about:
  homepage: https://github.com/pyparsing/pyparsing
  repository: https://github.com/pyparsing/pyparsing
  summary: Python parsing module
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
