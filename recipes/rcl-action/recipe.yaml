context:
  name: "rcl-action"
  ros_name: "rcl_action"
  version: "5.3.13"
  git_rev: "cbaee7c905e3276bb7a629eb1e18d8d3c781f194"
  source_dir: "rcl_action"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rcl.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - cd ${{ source_dir }}
    - cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
    - cmake --build build --target install -- -j"$(nproc)"

requirements:
  build:
    - patchelf
  host:
    - action-msgs
    - ament-cmake-gen-version-h
    - ament-cmake-ros
    - rcl
    - rcutils
    - rmw
    - rosidl-runtime-c
  run:
    - action-msgs
    - ament-cmake-gen-version-h
    - ament-cmake-ros
    - rcl
    - rcutils
    - rmw
    - rosidl-runtime-c

# This recipe intentionally uses host cmake and compiler on the native riscv runner.
# future requirements:
#   build:
#     - c-compiler
#     - cxx-compiler
#     - cmake
#     - make
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/lib/lib${{ ros_name }}.so
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/rcl_action.h
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_rcl_action C)
        find_package(rcl_action REQUIRED)
        add_executable(test_rcl_action test_rcl_action.c)
        target_link_libraries(test_rcl_action PRIVATE rcl_action::rcl_action)
        EOF
      - |
        cat > test_rcl_action.c <<'EOF'
        #include <rcl_action/types.h>
        int main(void) {
          rcl_action_goal_info_t info = rcl_action_get_zero_initialized_goal_info();
          return info.goal_id.uuid[0] == 0 ? 0 : 1;
        }
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - cmake --build build
      - ./build/test_rcl_action

about:
  homepage: https://github.com/ros2/rcl
  repository: https://github.com/ros2/rcl
  summary: C action implementation for ROS 2
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
