context:
  name: "rcl-interfaces"
  ros_name: "rcl_interfaces"
  version: "2.0.0"
  git_rev: "fa5d52c30e32d3ab5a85b7fbb36c8a75280e4c9b"
  source_dir: "rcl_interfaces"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rcl_interfaces.git
  rev: ${{ git_rev }}

build:
  number: 1
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$(python3 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
      export PYTHONPATH="$SITE_PACKAGES${PYTHONPATH:+:$PYTHONPATH}"
    - cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPython3_EXECUTABLE=/usr/bin/python3 -DPYTHON_EXECUTABLE=/usr/bin/python3
    - cmake --build build --target install -- -j"$(nproc)"
    - |
      python3 - <<'PY'
      import os
      import re
      from pathlib import Path

      cmake_dir = Path(os.environ["PREFIX"]) / "share/rcl_interfaces/cmake"
      for path in cmake_dir.glob("*.cmake"):
          text = path.read_text()
          text = re.sub(r'INTERFACE_INCLUDE_DIRECTORIES\s+"[^"]*(?:host_env_placehold|/usr/lib|python3-numpy|numpy/_core/include)[^"]*"', 'INTERFACE_INCLUDE_DIRECTORIES "${_IMPORT_PREFIX}/include/rcl_interfaces"', text)
          text = re.sub(r';?/usr/lib/riscv64-linux-gnu/libpython[^;"]*', '', text)
          path.write_text(text)
      PY

requirements:
  build:
    - patchelf
  host:
    - ament-cmake
    - builtin-interfaces
    - rosidl-default-generators
    - setuptools
  run:
    - ament-cmake
    - builtin-interfaces
    - rosidl-default-runtime

# This recipe intentionally uses host cmake and compiler on the native riscv runner.
# future requirements:
#   build:
#     - c-compiler
#     - cxx-compiler
#     - cmake
#     - make
#   host:
#     - python
#   run:
#     - libstdcxx
#     - python

tests:
  - script:
      - test -f $PREFIX/share/${{ ros_name }}/msg/Parameter.idl
      - test -f $PREFIX/share/${{ ros_name }}/srv/GetParameters.idl
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/parameter.hpp
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/srv/get_parameters.hpp
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_generator_c.so
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_typesupport_c.so
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_typesupport_cpp.so
      - test -f $PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}
      - test -f $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - grep -q 'msg/Parameter.idl' $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - |
        if grep -R -E 'host_env_placehold|/usr/lib|python3-numpy|numpy/_core/include' "$PREFIX/share/${{ ros_name }}/cmake"; then
          echo "${{ ros_name }} CMake exports contain non-relocatable include paths"
          exit 1
        fi
      - |
        cat > CMakeLists.txt <<EOF2
        cmake_minimum_required(VERSION 3.16)
        project(test_rcl_interfaces C CXX)
        find_package(rcl_interfaces REQUIRED)
        if(NOT "msg/Parameter.idl" IN_LIST rcl_interfaces_IDL_FILES)
          message(FATAL_ERROR "missing msg/Parameter.idl")
        endif()
        EOF2
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX

about:
  homepage: https://github.com/ros2/rcl_interfaces
  repository: https://github.com/ros2/rcl_interfaces
  summary: ROS client library parameter and logger interfaces
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
