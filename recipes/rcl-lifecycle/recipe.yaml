context:
  name: "rcl-lifecycle"
  ros_name: "rcl_lifecycle"
  version: "5.3.13"
  git_rev: "cbaee7c905e3276bb7a629eb1e18d8d3c781f194"
  source_dir: "rcl_lifecycle"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rcl.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - cd ${{ source_dir }}
    - cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
    - cmake --build build --target install -- -j"$(nproc)"

requirements:
  build:
    - patchelf
  host:
    - ament-cmake-gen-version-h
    - ament-cmake-ros
    - lifecycle-msgs
    - rcl
    - rcutils
    - rmw
    - rosidl-runtime-c
    - tracetools
  run:
    - ament-cmake-gen-version-h
    - ament-cmake-ros
    - lifecycle-msgs
    - rcl
    - rcutils
    - rmw
    - rosidl-runtime-c
    - tracetools

# This recipe intentionally uses host cmake and compiler on the native riscv runner.
# future requirements:
#   build:
#     - c-compiler
#     - cxx-compiler
#     - cmake
#     - make
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/lib/lib${{ ros_name }}.so
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/rcl_lifecycle.h
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_rcl_lifecycle C)
        find_package(rcl_lifecycle REQUIRED)
        add_executable(test_rcl_lifecycle test_rcl_lifecycle.c)
        target_link_libraries(test_rcl_lifecycle PRIVATE rcl_lifecycle::rcl_lifecycle)
        EOF
      - |
        cat > test_rcl_lifecycle.c <<'EOF'
        #include <rcl_lifecycle/data_types.h>
        int main(void) {
          rcl_lifecycle_state_machine_t machine = {0};
          return machine.current_state == 0 ? 0 : 1;
        }
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - cmake --build build
      - ./build/test_rcl_lifecycle

about:
  homepage: https://github.com/ros2/rcl
  repository: https://github.com/ros2/rcl
  summary: C lifecycle implementation for ROS 2
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
