context:
  name: "rcl-logging-spdlog"
  ros_name: "rcl_logging_spdlog"
  version: "2.3.1"
  git_rev: "1b7a4e34884005f28eeb04065b5d94565c67b11d"
  source_dir: "rcl_logging_spdlog"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rcl_logging.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - cd ${{ source_dir }}
    - cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
    - cmake --build build --target install -- -j"$(nproc)"

requirements:
  build:
    - patchelf
  host:
    - ament-cmake-ros
    - rcl-logging-interface
    - rcpputils
    - rcutils
    - spdlog
    - spdlog-vendor
  run:
    - ament-cmake-ros
    - rcl-logging-interface
    - rcpputils
    - rcutils
    - spdlog
    - spdlog-vendor

# This recipe intentionally uses host cmake and compiler on the native riscv runner.
# future requirements:
#   build:
#     - cxx-compiler
#     - cmake
#     - make
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/lib/lib${{ ros_name }}.so
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_rcl_logging_spdlog CXX)
        find_package(rcl_logging_spdlog REQUIRED)
        add_executable(test_rcl_logging_spdlog test_rcl_logging_spdlog.cpp)
        target_link_libraries(test_rcl_logging_spdlog PRIVATE rcl_logging_spdlog::rcl_logging_spdlog)
        EOF
      - |
        cat > test_rcl_logging_spdlog.cpp <<'EOF'
        #include <rcl_logging_interface/rcl_logging_interface.h>
        int main() {
          rcutils_allocator_t allocator = rcutils_get_default_allocator();
          if (rcl_logging_external_initialize("", allocator) != RCL_LOGGING_RET_OK) {
            return 1;
          }
          return rcl_logging_external_shutdown() == RCL_LOGGING_RET_OK ? 0 : 1;
        }
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - cmake --build build
      - ./build/test_rcl_logging_spdlog

about:
  homepage: https://github.com/ros2/rcl_logging
  repository: https://github.com/ros2/rcl_logging
  summary: spdlog backend for rcl logging
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
