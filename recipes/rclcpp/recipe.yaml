context:
  name: "rclcpp"
  version: "16.0.19"
  git_rev: "867bcf5579bac32ab888460dddca49d7ae3671ea"
  source_dir: "rclcpp"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rclcpp.git
  rev: ${{ git_rev }}

build:
  number: 1
  script:
    - |
      SITE_PACKAGES=$($PREFIX/bin/python3.12 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
      export PYTHONPATH="$SITE_PACKAGES${PYTHONPATH:+:$PYTHONPATH}"
    - cd ${{ source_dir }}
    - $PREFIX/bin/cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPython3_EXECUTABLE="$PREFIX/bin/python3.12"
    - $PREFIX/bin/cmake --build build --target install -- -j"$(nproc)"
    - |
      $PREFIX/bin/python3.12 - <<'PY'
      import os
      import re
      from pathlib import Path

      export_file = Path(os.environ["PREFIX"]) / "share/rclcpp/cmake/rclcppExport.cmake"
      text = export_file.read_text()
      text = re.sub(
          r'INTERFACE_INCLUDE_DIRECTORIES\s+"[^"]*"',
          'INTERFACE_INCLUDE_DIRECTORIES "${_IMPORT_PREFIX}/include/rclcpp"',
          text,
      )
      export_file.write_text(text)
      PY

requirements:
  build:
    - patchelf
  host:
    - ament-cmake-gen-version-h
    - ament-cmake-ros
    - ament-index-cpp
    - builtin-interfaces
    - cmake
    - empy
    - libstatistics-collector
    - python
    - rcl
    - rcl-interfaces
    - rcl-yaml-param-parser
    - rcpputils
    - rcutils
    - rmw
    - rosgraph-msgs
    - rosidl-runtime-cpp
    - rosidl-typesupport-c
    - rosidl-typesupport-cpp
    - statistics-msgs
    - tracetools
  run:
    - ament-cmake-gen-version-h
    - ament-cmake-ros
    - ament-index-cpp
    - builtin-interfaces
    - libstatistics-collector
    - rcl
    - rcl-interfaces
    - rcl-yaml-param-parser
    - rcpputils
    - rcutils
    - rmw
    - rosgraph-msgs
    - rosidl-runtime-cpp
    - rosidl-typesupport-c
    - rosidl-typesupport-cpp
    - statistics-msgs
    - tracetools

# This recipe intentionally uses the host compiler on the native riscv runner.
# Enable the compiler dependencies once the riscv channel has them.
# future requirements:
#   build:
#     - c-compiler
#     - cxx-compiler
#     - make
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/lib/librclcpp.so
      - test -f $PREFIX/include/rclcpp/rclcpp/rclcpp.hpp
      - test -f $PREFIX/share/rclcpp/cmake/rclcppConfig.cmake
      - |
        if grep -R -E 'host_env_placehold|/usr/lib|python3-numpy|numpy/_core/include' "$PREFIX/share/rclcpp/cmake"; then
          echo "rclcpp CMake exports contain non-relocatable include paths"
          exit 1
        fi
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.16)
        project(test_rclcpp CXX)
        find_package(rclcpp REQUIRED)
        add_executable(test_rclcpp test_rclcpp.cpp)
        target_link_libraries(test_rclcpp PRIVATE rclcpp::rclcpp)
        EOF
      - |
        cat > test_rclcpp.cpp <<'EOF'
        #include <rclcpp/init_options.hpp>
        int main() {
          return sizeof(rclcpp::InitOptions) > 0 ? 0 : 1;
        }
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - cmake --build build
      - ./build/test_rclcpp

about:
  homepage: https://github.com/ros2/rclcpp
  repository: https://github.com/ros2/rclcpp
  summary: C++ client library for ROS 2
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
