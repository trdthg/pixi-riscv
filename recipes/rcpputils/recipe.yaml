context:
  name: "rcpputils"
  version: "2.4.6"
  git_rev: "2f222639d35e2b8ecd34691abfe0f3ad91e81395"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rcpputils.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - mkdir -p "$PREFIX/include" "$PREFIX/lib" "$PREFIX/share/rcpputils/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - cp -R include/rcpputils "$PREFIX/include/"
    - cp -R include/rcppmath "$PREFIX/include/"
    - |
      c++ -std=c++14 -fPIC -Iinclude -I"$PREFIX/include" \
        -shared \
        src/asserts.cpp src/filesystem_helper.cpp src/find_library.cpp \
        src/env.cpp src/shared_library.cpp \
        -L"$PREFIX/lib" -lrcutils -ldl -Wl,-rpath,"$PREFIX/lib" \
        -o "$PREFIX/lib/librcpputils.so"
    - cp package.xml "$PREFIX/share/rcpputils/package.xml"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/rcpputils"
    - |
      cat > "$PREFIX/share/rcpputils/cmake/rcpputilsConfig.cmake" <<'EOF'
      find_package(rcutils REQUIRED)
      include("${CMAKE_CURRENT_LIST_DIR}/rcpputilsTargets.cmake")
      set(rcpputils_LIBRARIES rcpputils::rcpputils)
      set(rcpputils_INCLUDE_DIRS "${CMAKE_CURRENT_LIST_DIR}/../../../include")
      EOF
    - |
      cat > "$PREFIX/share/rcpputils/cmake/rcpputilsTargets.cmake" <<'EOF'
      add_library(rcpputils::rcpputils SHARED IMPORTED)
      set_target_properties(rcpputils::rcpputils PROPERTIES
        IMPORTED_LOCATION "${CMAKE_CURRENT_LIST_DIR}/../../../lib/librcpputils.so"
        INTERFACE_INCLUDE_DIRECTORIES "${CMAKE_CURRENT_LIST_DIR}/../../../include"
        INTERFACE_LINK_LIBRARIES "rcutils::rcutils"
      )
      EOF

requirements:
  host:
    - rcutils
  run:
    - rcutils

# future requirements:
#   build:
#     - cxx-compiler
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/lib/librcpputils.so
      - test -f $PREFIX/include/rcpputils/shared_library.hpp
      - test -f $PREFIX/include/rcppmath/clamp.hpp
      - test -f $PREFIX/share/ament_index/resource_index/packages/rcpputils
      - |
        cat > test_rcpputils.cpp <<'EOF'
        #include <rcppmath/clamp.hpp>
        #include <rcpputils/split.hpp>
        int main() {
          auto parts = rcpputils::split("a:b", ':');
          return (parts.size() == 2 && rcppmath::clamp(5, 1, 3) == 3) ? 0 : 1;
        }
        EOF
      - c++ -std=c++14 -I$PREFIX/include test_rcpputils.cpp -L$PREFIX/lib -lrcpputils -lrcutils -Wl,-rpath,$PREFIX/lib -o test_rcpputils
      - ./test_rcpputils

about:
  homepage: https://github.com/ros2/rcpputils
  repository: https://github.com/ros2/rcpputils
  summary: C++ utility functions and types used by ROS 2
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
