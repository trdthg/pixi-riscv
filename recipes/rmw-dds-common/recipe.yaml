context:
  name: "rmw-dds-common"
  ros_name: "rmw_dds_common"
  version: "1.6.0"
  git_rev: "e26ba1079886c5598614172db0b27526aa6af07d"
  source_dir: "rmw_dds_common"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rmw_dds_common.git
  rev: ${{ git_rev }}

build:
  number: 2
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$("$PREFIX/bin/python3.12" -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
      export PYTHONPATH="$SITE_PACKAGES${PYTHONPATH:+:$PYTHONPATH}"
    - $PREFIX/bin/cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPython3_EXECUTABLE="$PREFIX/bin/python3.12" -DPYTHON_EXECUTABLE="$PREFIX/bin/python3.12"
    - $PREFIX/bin/cmake --build build --target install -- -j"$(nproc)"
    - |
      "$PREFIX/bin/python3.12" - <<'PY'
      import os
      import re
      from pathlib import Path

      cmake_dir = Path(os.environ["PREFIX"]) / "share/rmw_dds_common/cmake"
      for path in cmake_dir.glob("*.cmake"):
          text = path.read_text()
          text = text.replace('/usr/lib/riscv64-linux-gnu/python3-numpy/numpy/_core/include', '${_IMPORT_PREFIX}/lib/python3.12/site-packages/numpy/_core/include')
          text = re.sub(r'[^;"]*host_env_placehold[^;"]*numpy[^;"]*', '${_IMPORT_PREFIX}/lib/python3.12/site-packages/numpy/_core/include', text)
          text = re.sub(r'/usr/lib/riscv64-linux-gnu/libpython[0-9.]*\.so', '${_IMPORT_PREFIX}/lib/libpython3.12.so', text)
          text = re.sub(r'[^;"]*host_env_placehold[^;"]*libpython[0-9.]*\.so', '${_IMPORT_PREFIX}/lib/libpython3.12.so', text)
          path.write_text(text)
      PY

requirements:
  build:
    - cmake
    - patchelf
  host:
    - ament-cmake
    - numpy
    - python
    - rcpputils
    - rcutils
    - rmw
    - rosidl-default-generators
    - rosidl-typesupport-cpp
    - setuptools
  run:
    - ament-cmake
    - numpy
    - python
    - rcpputils
    - rcutils
    - rmw
    - rosidl-default-runtime
    - rosidl-typesupport-cpp

# This recipe intentionally uses the host compiler on the native riscv runner.
# Enable the compiler dependency once the riscv channel has it.
# future requirements:
#   build:
#     - cxx-compiler
#     - make
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/lib/librmw_dds_common.so
      - test -f $PREFIX/lib/librmw_dds_common__rosidl_typesupport_cpp.so
      - test -f $PREFIX/lib/librmw_dds_common__rosidl_typesupport_fastrtps_cpp.so
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/graph_cache.hpp
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/participant_entities_info.hpp
      - test -f $PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}
      - test -f $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - grep -q 'msg/ParticipantEntitiesInfo.idl' $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.16)
        project(test_rmw_dds_common CXX)
        find_package(rmw_dds_common REQUIRED)
        add_executable(test_rmw_dds_common test_rmw_dds_common.cpp)
        target_link_libraries(test_rmw_dds_common PRIVATE rmw_dds_common::rmw_dds_common_library)
        EOF
      - |
        cat > test_rmw_dds_common.cpp <<'EOF'
        #include <rosidl_typesupport_cpp/message_type_support.hpp>
        #include <rmw_dds_common/gid_utils.hpp>
        #include <rmw_dds_common/msg/gid.hpp>
        #include <rmw_dds_common/msg/participant_entities_info.hpp>
        int main() {
          rmw_gid_t gid{};
          rmw_dds_common::msg::Gid msg;
          rmw_dds_common::convert_gid_to_msg(&gid, &msg);
          rmw_gid_t roundtrip{};
          rmw_dds_common::convert_msg_to_gid(&msg, &roundtrip);
          auto ts = rosidl_typesupport_cpp::get_message_type_support_handle<
            rmw_dds_common::msg::ParticipantEntitiesInfo>();
          return rmw_dds_common::operator==(gid, roundtrip) && ts != nullptr ? 0 : 1;
        }
        EOF
      - $PREFIX/bin/cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - $PREFIX/bin/cmake --build build
      - ./build/test_rmw_dds_common
      - |
        if grep -R -E 'host_env_placehold|python3-numpy|/usr/lib/riscv64-linux-gnu/(python|libpython)|libpython3\.13' "$PREFIX/share/${{ ros_name }}/cmake"; then
          echo "${{ ros_name }} CMake exports contain system Python/numpy paths"
          exit 1
        fi
      - |
        missing=$(ldd -r $PREFIX/lib/librmw_dds_common.so 2>&1 | grep 'undefined symbol' || true)
        test -z "$missing" || { echo "$missing"; exit 1; }

about:
  homepage: https://github.com/ros2/rmw_dds_common
  repository: https://github.com/ros2/rmw_dds_common
  summary: Common DDS utilities for ROS 2 middleware implementations
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
