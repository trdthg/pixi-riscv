context:
  name: "rmw-dds-common"
  ros_name: "rmw_dds_common"
  version: "1.6.0"
  git_rev: "e26ba1079886c5598614172db0b27526aa6af07d"
  source_dir: "rmw_dds_common"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rmw_dds_common.git
  rev: ${{ git_rev }}

build:
  number: 1
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$(python3 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
      export PYTHONPATH="$SITE_PACKAGES${PYTHONPATH:+:$PYTHONPATH}"
    - cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
    - cmake --build build --target install -- -j"$(nproc)"

requirements:
  build:
    - patchelf
  host:
    - ament-cmake
    - rcpputils
    - rcutils
    - rmw
    - rosidl-default-generators
    - rosidl-typesupport-cpp
    - setuptools
  run:
    - ament-cmake
    - rcpputils
    - rcutils
    - rmw
    - rosidl-default-runtime
    - rosidl-typesupport-cpp

# This recipe intentionally uses host cmake, compiler, and Python on the native
# riscv runner. Enable these dependencies once the riscv channel has them.
# future requirements:
#   build:
#     - cxx-compiler
#     - cmake
#     - make
#   host:
#     - python
#   run:
#     - libstdcxx
#     - python

tests:
  - script:
      - test -f $PREFIX/lib/librmw_dds_common.so
      - test -f $PREFIX/lib/librmw_dds_common__rosidl_typesupport_cpp.so
      - test -f $PREFIX/lib/librmw_dds_common__rosidl_typesupport_fastrtps_cpp.so
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/graph_cache.hpp
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/participant_entities_info.hpp
      - test -f $PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}
      - test -f $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - grep -q 'msg/ParticipantEntitiesInfo.idl' $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.16)
        project(test_rmw_dds_common CXX)
        find_package(rmw_dds_common REQUIRED)
        add_executable(test_rmw_dds_common test_rmw_dds_common.cpp)
        target_link_libraries(test_rmw_dds_common PRIVATE rmw_dds_common::rmw_dds_common_library)
        EOF
      - |
        cat > test_rmw_dds_common.cpp <<'EOF'
        #include <rosidl_typesupport_cpp/message_type_support.hpp>
        #include <rmw_dds_common/gid_utils.hpp>
        #include <rmw_dds_common/msg/gid.hpp>
        #include <rmw_dds_common/msg/participant_entities_info.hpp>
        int main() {
          rmw_gid_t gid{};
          rmw_dds_common::msg::Gid msg;
          rmw_dds_common::convert_gid_to_msg(&gid, &msg);
          rmw_gid_t roundtrip{};
          rmw_dds_common::convert_msg_to_gid(&msg, &roundtrip);
          auto ts = rosidl_typesupport_cpp::get_message_type_support_handle<
            rmw_dds_common::msg::ParticipantEntitiesInfo>();
          return rmw_dds_common::operator==(gid, roundtrip) && ts != nullptr ? 0 : 1;
        }
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - cmake --build build
      - ./build/test_rmw_dds_common
      - |
        missing=$(ldd -r $PREFIX/lib/librmw_dds_common.so 2>&1 | grep 'undefined symbol' || true)
        test -z "$missing" || { echo "$missing"; exit 1; }

about:
  homepage: https://github.com/ros2/rmw_dds_common
  repository: https://github.com/ros2/rmw_dds_common
  summary: Common DDS utilities for ROS 2 middleware implementations
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
