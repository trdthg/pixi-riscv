context:
  name: "rmw-fastrtps-cpp"
  ros_name: "rmw_fastrtps_cpp"
  version: "6.2.7"
  git_rev: "37f7ef88fbec216d47883763f185bd39fc50b5a1"
  source_dir: "rmw_fastrtps_cpp"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rmw_fastrtps.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - cd ${{ source_dir }}
    - cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
    - cmake --build build --target install -- -j"$(nproc)"

requirements:
  build:
    - patchelf
  host:
    - ament-cmake-ros
    - fastcdr
    - fastrtps
    - fastrtps-cmake-module
    - rcpputils
    - rcutils
    - rmw
    - rmw-dds-common
    - rmw-fastrtps-shared-cpp
    - rosidl-runtime-c
    - rosidl-runtime-cpp
    - rosidl-typesupport-c
    - rosidl-typesupport-cpp
    - rosidl-typesupport-fastrtps-c
    - rosidl-typesupport-fastrtps-cpp
    - rosidl-typesupport-introspection-c
    - rosidl-typesupport-introspection-cpp
    - tracetools
  run:
    - ament-cmake-ros
    - fastcdr
    - fastrtps
    - fastrtps-cmake-module
    - rcpputils
    - rcutils
    - rmw
    - rmw-dds-common
    - rmw-fastrtps-shared-cpp
    - rosidl-runtime-c
    - rosidl-runtime-cpp
    - rosidl-typesupport-c
    - rosidl-typesupport-cpp
    - rosidl-typesupport-fastrtps-c
    - rosidl-typesupport-fastrtps-cpp
    - rosidl-typesupport-introspection-c
    - rosidl-typesupport-introspection-cpp
    - tracetools

# This recipe intentionally uses host cmake and compiler on the native riscv runner.
# future requirements:
#   build:
#     - cxx-compiler
#     - cmake
#     - make
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/lib/librmw_fastrtps_cpp.so
      - test -f $PREFIX/include/rmw_fastrtps_cpp/rmw_fastrtps_cpp/identifier.hpp
      - test -f $PREFIX/share/rmw_fastrtps_cpp/package.xml
      - test -f $PREFIX/share/ament_index/resource_index/packages/rmw_fastrtps_cpp
      - test -f $PREFIX/share/ament_index/resource_index/rmw_typesupport/rmw_fastrtps_cpp
      - test -f $PREFIX/share/ament_index/resource_index/rmw_typesupport_c/rmw_fastrtps_cpp
      - test -f $PREFIX/share/ament_index/resource_index/rmw_typesupport_cpp/rmw_fastrtps_cpp
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_rmw_fastrtps_cpp CXX)
        find_package(rmw_fastrtps_cpp REQUIRED)
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX

about:
  homepage: https://github.com/ros2/rmw_fastrtps
  repository: https://github.com/ros2/rmw_fastrtps
  summary: ROS 2 RMW implementation using Fast DDS static type support
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
