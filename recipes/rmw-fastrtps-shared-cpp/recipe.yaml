context:
  name: "rmw-fastrtps-shared-cpp"
  ros_name: "rmw_fastrtps_shared_cpp"
  version: "6.2.10"
  git_rev: "cbe12977497c9c536317ca6488edf2f23b8c1830"
  source_dir: "rmw_fastrtps_shared_cpp"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rmw_fastrtps.git
  rev: ${{ git_rev }}

build:
  number: 1
  script:
    - cd ${{ source_dir }}
    - $PREFIX/bin/cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
    - $PREFIX/bin/cmake --build build --target install -- -j"$(nproc)"

requirements:
  build:
    - cmake
    - patchelf
  host:
    - ament-cmake-gmock
    - ament-cmake-gtest
    - ament-cmake-ros
    - fastcdr
    - fastrtps
    - fastrtps-cmake-module
    - rcpputils
    - rcutils
    - rmw
    - rmw-dds-common
    - rosidl-typesupport-introspection-c
    - rosidl-typesupport-introspection-cpp
    - tracetools
  run:
    - ament-cmake-gmock
    - ament-cmake-gtest
    - ament-cmake-ros
    - fastcdr
    - fastrtps
    - fastrtps-cmake-module
    - rcpputils
    - rcutils
    - rmw
    - rmw-dds-common
    - rosidl-typesupport-introspection-c
    - rosidl-typesupport-introspection-cpp
    - tracetools

# This recipe intentionally uses the host compiler on the native riscv runner.
# future requirements:
#   build:
#     - cxx-compiler
#     - make
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/lib/librmw_fastrtps_shared_cpp.so
      - test -f $PREFIX/include/rmw_fastrtps_shared_cpp/rmw_fastrtps_shared_cpp/visibility_control.h
      - test -f $PREFIX/share/rmw_fastrtps_shared_cpp/package.xml
      - test -f $PREFIX/share/ament_index/resource_index/packages/rmw_fastrtps_shared_cpp
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_rmw_fastrtps_shared_cpp CXX)
        find_package(rmw_fastrtps_shared_cpp REQUIRED)
        EOF
      - $PREFIX/bin/cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - |
        missing=$(ldd -r $PREFIX/lib/librmw_fastrtps_shared_cpp.so 2>&1 | grep 'undefined symbol' || true)
        test -z "$missing" || { echo "$missing"; exit 1; }

about:
  homepage: https://github.com/ros2/rmw_fastrtps
  repository: https://github.com/ros2/rmw_fastrtps
  summary: Shared C++ implementation code for ROS 2 Fast DDS RMW packages
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
