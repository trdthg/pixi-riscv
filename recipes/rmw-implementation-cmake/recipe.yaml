context:
  name: "rmw-implementation-cmake"
  ros_name: "rmw_implementation_cmake"
  version: "6.1.1"
  git_rev: "2a4ee718d0da004d5629f50afd2896fbd1f4aedd"
  source_dir: "rmw_implementation_cmake"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rmw.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - cd ${{ source_dir }}
    - mkdir -p "$PREFIX/share/${{ ros_name }}/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - cp package.xml "$PREFIX/share/${{ ros_name }}/package.xml"
    - cp -R cmake "$PREFIX/share/${{ ros_name }}/"
    - cp rmw_implementation_cmake-extras.cmake "$PREFIX/share/${{ ros_name }}/cmake/"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}"
    - |
      cat > "$PREFIX/share/${{ ros_name }}/cmake/rmw_implementation_cmakeConfig.cmake" <<'EOF'
      find_package(ament_cmake_core REQUIRED)
      include("${CMAKE_CURRENT_LIST_DIR}/rmw_implementation_cmake-extras.cmake")
      EOF

requirements:
  host:
    - ament-cmake-core
  run:
    - ament-cmake-core

# future requirements:
#   build:
#     - cmake

tests:
  - script:
      - test -f $PREFIX/share/rmw_implementation_cmake/package.xml
      - test -f $PREFIX/share/ament_index/resource_index/packages/rmw_implementation_cmake
      - test -f $PREFIX/share/rmw_implementation_cmake/cmake/rmw_implementation_cmakeConfig.cmake
      - test -f $PREFIX/share/rmw_implementation_cmake/cmake/get_default_rmw_implementation.cmake

about:
  homepage: https://github.com/ros2/rmw
  repository: https://github.com/ros2/rmw
  summary: CMake helpers for discovering ROS 2 middleware implementations
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
