context:
  name: "rosgraph-msgs"
  ros_name: "rosgraph_msgs"
  version: "2.0.0"
  git_rev: "fa5d52c30e32d3ab5a85b7fbb36c8a75280e4c9b"
  source_dir: "rosgraph_msgs"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rcl_interfaces.git
  rev: ${{ git_rev }}

build:
  number: 2
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$("$PREFIX/bin/python3.12" -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
      export PYTHONPATH="$SITE_PACKAGES${PYTHONPATH:+:$PYTHONPATH}"
    - $PREFIX/bin/cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPython3_EXECUTABLE="$PREFIX/bin/python3.12" -DPYTHON_EXECUTABLE="$PREFIX/bin/python3.12"
    - $PREFIX/bin/cmake --build build --target install -- -j"$(nproc)"
    - |
      "$PREFIX/bin/python3.12" - <<'PY'
      import os
      import re
      from pathlib import Path

      cmake_dir = Path(os.environ["PREFIX"]) / "share/rosgraph_msgs/cmake"
      for path in cmake_dir.glob("*.cmake"):
          text = path.read_text()
          text = re.sub(r'INTERFACE_INCLUDE_DIRECTORIES\s+"[^"]*(?:host_env_placehold|/usr/lib|python3-numpy|numpy/_core/include|libpython3)[^"]*"', 'INTERFACE_INCLUDE_DIRECTORIES "${_IMPORT_PREFIX}/include/rosgraph_msgs"', text)
          text = re.sub(r';?/usr/lib/riscv64-linux-gnu/libpython[^;"]*', '', text)
          path.write_text(text)
      PY

requirements:
  build:
    - cmake
    - patchelf
  host:
    - ament-cmake
    - builtin-interfaces
    - numpy
    - python
    - rosidl-default-generators
    - setuptools
  run:
    - ament-cmake
    - builtin-interfaces
    - numpy
    - python
    - rosidl-default-runtime

# This recipe intentionally uses host cmake and compiler on the native riscv runner.
# future requirements:
#   build:
#     - c-compiler
#     - cxx-compiler
#     - make
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/share/${{ ros_name }}/msg/Clock.idl
      - test -f $PREFIX/share/${{ ros_name }}/msg/Clock.msg
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/clock.hpp
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/clock.h
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_generator_c.so
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_typesupport_c.so
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_typesupport_cpp.so
      - test -f $PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}
      - test -f $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - grep -q 'msg/Clock.idl' $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - |
        if grep -R -E 'host_env_placehold|/usr/lib|python3-numpy|numpy/_core/include|libpython3' "$PREFIX/share/${{ ros_name }}/cmake"; then
          echo "${{ ros_name }} CMake exports contain non-relocatable include paths"
          exit 1
        fi
      - |
        cat > CMakeLists.txt <<EOF2
        cmake_minimum_required(VERSION 3.16)
        project(test_rosgraph_msgs C CXX)
        find_package(rosgraph_msgs REQUIRED)
        if(NOT "msg/Clock.idl" IN_LIST rosgraph_msgs_IDL_FILES)
          message(FATAL_ERROR "missing msg/Clock.idl")
        endif()
        EOF2
      - $PREFIX/bin/cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX

about:
  homepage: https://github.com/ros2/rcl_interfaces
  repository: https://github.com/ros2/rcl_interfaces
  summary: ROS graph messages
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
