context:
  name: "rosidl-cli"
  version: "3.1.8"
  git_rev: "8cdfe315157f8bffa9b73b6750c52f44325a7847"
  source_dir: "rosidl_cli"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rosidl.git
  rev: ${{ git_rev }}

build:
  number: 1
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$($PREFIX/bin/python3.12 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
    - mkdir -p "$SITE_PACKAGES" "$PREFIX/bin" "$PREFIX/share/rosidl_cli/environment" "$PREFIX/share/ament_index/resource_index/packages"
    - cp -R rosidl_cli "$SITE_PACKAGES/"
    - cp package.xml resource/package.dsv "$PREFIX/share/rosidl_cli/"
    - cp completion/rosidl-argcomplete.bash "$PREFIX/share/rosidl_cli/environment/"
    - cp completion/rosidl-argcomplete.zsh "$PREFIX/share/rosidl_cli/environment/"
    - cp resource/rosidl_cli "$PREFIX/share/ament_index/resource_index/packages/rosidl_cli"
    - mkdir -p "$SITE_PACKAGES/rosidl_cli-${{ version }}.dist-info"
    - |
      cat > "$SITE_PACKAGES/rosidl_cli-${{ version }}.dist-info/METADATA" <<'EOF'
      Metadata-Version: 2.1
      Name: rosidl-cli
      Version: ${{ version }}
      EOF
    - |
      cat > "$SITE_PACKAGES/rosidl_cli-${{ version }}.dist-info/entry_points.txt" <<'EOF'
      [console_scripts]
      rosidl = rosidl_cli.cli:main
      EOF
    - |
      cat > "$PREFIX/bin/rosidl" <<'EOF'
      #!/usr/bin/env sh
      prefix=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
      exec "$prefix/bin/python3.12" -m rosidl_cli.cli "$@"
      EOF
    - chmod +x "$PREFIX/bin/rosidl"

requirements:
  host:
    - python
  run:
    - python
#     - argcomplete

tests:
  - script:
      - |
        SITE_PACKAGES=$($PREFIX/bin/python3.12 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
      - $PREFIX/bin/python3.12 -c "import rosidl_cli; print('rosidl_cli ok')"
      - test -x $PREFIX/bin/rosidl
      - $PREFIX/bin/rosidl --help
      - test -f $PREFIX/share/ament_index/resource_index/packages/rosidl_cli

about:
  homepage: https://github.com/ros2/rosidl
  repository: https://github.com/ros2/rosidl
  summary: Command line tools for ROS interface generation
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
