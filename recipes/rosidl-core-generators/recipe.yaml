context:
  name: "rosidl-core-generators"
  ros_name: "rosidl_core_generators"
  version: "1.3.0"

package:
  name: ${{ name }}
  version: ${{ version }}

build:
  number: 0
  script:
    - mkdir -p "$PREFIX/share/${{ ros_name }}/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - |
      cat > "$PREFIX/share/${{ ros_name }}/package.xml" <<'EOF'
      <?xml version="1.0"?>
      <package format="3">
        <name>rosidl_core_generators</name>
        <version>${{ version }}</version>
        <description>Core ROS interface generators configuration package.</description>
        <maintainer email="noreply@example.com">pixi-riscv</maintainer>
        <license>Apache-2.0</license>
        <buildtool_depend>ament_cmake</buildtool_depend>
        <export><build_type>ament_cmake</build_type></export>
      </package>
      EOF
    - |
      cat > "$PREFIX/share/${{ ros_name }}/cmake/${{ ros_name }}Config.cmake" <<'EOF'
      include_guard(GLOBAL)
      find_package(ament_cmake_core REQUIRED)
      find_package(rosidl_cmake REQUIRED)
      find_package(rosidl_generator_c REQUIRED)
      find_package(rosidl_generator_cpp REQUIRED)
      find_package(rosidl_generator_py REQUIRED)
      find_package(rosidl_typesupport_c REQUIRED)
      find_package(rosidl_typesupport_cpp REQUIRED)
      find_package(rosidl_typesupport_fastrtps_c REQUIRED)
      find_package(rosidl_typesupport_fastrtps_cpp REQUIRED)
      find_package(rosidl_typesupport_introspection_c REQUIRED)
      find_package(rosidl_typesupport_introspection_cpp REQUIRED)
      EOF
    - printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}"

requirements:
  host:
    - ament-cmake-core
    - rosidl-cmake
    - rosidl-generator-c
    - rosidl-generator-cpp
    - rosidl-generator-py
    - rosidl-typesupport-c
    - rosidl-typesupport-cpp
    - rosidl-typesupport-fastrtps-c
    - rosidl-typesupport-fastrtps-cpp
    - rosidl-typesupport-introspection-c
    - rosidl-typesupport-introspection-cpp
  run:
    - ament-cmake-core
    - rosidl-cmake
    - rosidl-generator-c
    - rosidl-generator-cpp
    - rosidl-generator-py
    - rosidl-typesupport-c
    - rosidl-typesupport-cpp
    - rosidl-typesupport-fastrtps-c
    - rosidl-typesupport-fastrtps-cpp
    - rosidl-typesupport-introspection-c
    - rosidl-typesupport-introspection-cpp

# future requirements:
#   build:
#     - cmake

tests:
  - script:
      - test -f $PREFIX/share/${{ ros_name }}/cmake/${{ ros_name }}Config.cmake
      - test -f $PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_rosidl_core_generators NONE)
        find_package(rosidl_core_generators REQUIRED)
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX

about:
  homepage: https://github.com/ros2/rosidl_defaults
  repository: https://github.com/ros2/rosidl_defaults
  summary: Core ROS interface generators configuration shim
  license: Apache-2.0

extra:
  recipe-maintainers:
    - trdthg
