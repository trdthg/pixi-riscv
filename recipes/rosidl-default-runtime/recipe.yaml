context:
  name: "rosidl-default-runtime"
  ros_name: "rosidl_default_runtime"
  version: "1.2.1"
  git_rev: "8266f1c0f062d405595570209cfb0ed3f71684ae"
  source_dir: "rosidl_default_runtime"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rosidl_defaults.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - cd ${{ source_dir }}
    - mkdir -p "$PREFIX/share/${{ ros_name }}/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - cp package.xml "$PREFIX/share/${{ ros_name }}/package.xml"
    - sed -e "s#@PROJECT_NAME@#${{ ros_name }}#g" ${{ ros_name }}-extras.cmake.in > "$PREFIX/share/${{ ros_name }}/cmake/${{ ros_name }}-extras.cmake"
    - |
      cat > "$PREFIX/share/${{ ros_name }}/cmake/${{ ros_name }}Config.cmake" <<'EOF'
      include("${CMAKE_CURRENT_LIST_DIR}/rosidl_default_runtime-extras.cmake")
      EOF
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}"

requirements:
  host:
    - ament-cmake-core
    - rosidl-generator-py
    - rosidl-runtime-c
    - rosidl-runtime-cpp
    - rosidl-typesupport-c
    - rosidl-typesupport-cpp
    - rosidl-typesupport-fastrtps-c
    - rosidl-typesupport-fastrtps-cpp
    - rosidl-typesupport-introspection-c
    - rosidl-typesupport-introspection-cpp
  run:
    - ament-cmake-core
    - rosidl-generator-py
    - rosidl-runtime-c
    - rosidl-runtime-cpp
    - rosidl-typesupport-c
    - rosidl-typesupport-cpp
    - rosidl-typesupport-fastrtps-c
    - rosidl-typesupport-fastrtps-cpp
    - rosidl-typesupport-introspection-c
    - rosidl-typesupport-introspection-cpp

# future requirements:
#   build:
#     - cmake

tests:
  - script:
      - test -f $PREFIX/share/${{ ros_name }}/package.xml
      - test -f $PREFIX/share/${{ ros_name }}/cmake/${{ ros_name }}Config.cmake
      - test -f $PREFIX/share/${{ ros_name }}/cmake/${{ ros_name }}-extras.cmake
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_rosidl_default_runtime NONE)
        find_package(rosidl_default_runtime REQUIRED)
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX

about:
  homepage: https://github.com/ros2/rosidl_defaults
  repository: https://github.com/ros2/rosidl_defaults
  summary: Default ROS interface runtime configuration package
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
