context:
  name: "rosidl-generator-c"
  version: "3.1.8"
  git_rev: "8cdfe315157f8bffa9b73b6750c52f44325a7847"
  source_dir: "rosidl_generator_c"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rosidl.git
  rev: ${{ git_rev }}

build:
  number: 2
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$(python3 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
    - mkdir -p "$SITE_PACKAGES" "$PREFIX/lib/rosidl_generator_c" "$PREFIX/share/rosidl_generator_c/cmake" "$PREFIX/share/rosidl_generator_c/resource" "$PREFIX/share/ament_index/resource_index/packages" "$PREFIX/share/ament_index/resource_index/rosidl_generator_packages"
    - cp -R rosidl_generator_c "$SITE_PACKAGES/"
    - cp package.xml "$PREFIX/share/rosidl_generator_c/package.xml"
    - cp bin/rosidl_generator_c "$PREFIX/lib/rosidl_generator_c/rosidl_generator_c.py"
    - |
      cat > "$PREFIX/lib/rosidl_generator_c/rosidl_generator_c" <<'EOF'
      #!/usr/bin/env sh
      prefix="$(CDPATH= cd -- "$(dirname -- "$0")/../.." && pwd)"
      site_packages="$(ROSIDL_GENERATOR_PREFIX="$prefix" python3 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["ROSIDL_GENERATOR_PREFIX"], "platbase": os.environ["ROSIDL_GENERATOR_PREFIX"]}))')"
      export PYTHONPATH="${site_packages}${PYTHONPATH:+:${PYTHONPATH}}"
      exec python3 "$prefix/lib/rosidl_generator_c/rosidl_generator_c.py" "$@"
      EOF
    - chmod +x "$PREFIX/lib/rosidl_generator_c/rosidl_generator_c" "$PREFIX/lib/rosidl_generator_c/rosidl_generator_c.py"
    - cp -R cmake "$PREFIX/share/rosidl_generator_c/"
    - cp -R resource "$PREFIX/share/rosidl_generator_c/"
    - |
      sed \
        -e "s#@PYTHON_INSTALL_DIR@#${SITE_PACKAGES#$PREFIX/}#g" \
        -e "s#@rosidl_generator_c_LIBRARY_TYPE@#SHARED#g" \
        rosidl_generator_c-extras.cmake.in > "$PREFIX/share/rosidl_generator_c/cmake/rosidl_generator_c-extras.cmake"
    - cp rosidl_generator_c/__init__.py "$SITE_PACKAGES/rosidl_generator_c/__init__.py"
    - cp rosidl_generator_c/cli.py "$SITE_PACKAGES/rosidl_generator_c/cli.py"
    - mkdir -p "$SITE_PACKAGES/rosidl_generator_c-${{ version }}.dist-info"
    - |
      cat > "$SITE_PACKAGES/rosidl_generator_c-${{ version }}.dist-info/METADATA" <<'EOF'
      Metadata-Version: 2.1
      Name: rosidl-generator-c
      Version: ${{ version }}
      EOF
    - |
      cat > "$SITE_PACKAGES/rosidl_generator_c-${{ version }}.dist-info/entry_points.txt" <<'EOF'
      [rosidl_cli.command.generate.type_extensions]
      c = rosidl_generator_c.cli:GenerateC
      EOF
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/rosidl_generator_c"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/rosidl_generator_packages/rosidl_generator_c"
    - |
      cat > "$PREFIX/share/rosidl_generator_c/cmake/rosidl_generator_cConfig.cmake" <<'EOF'
      include_guard(GLOBAL)
      include("${CMAKE_CURRENT_LIST_DIR}/rosidl_generator_c-extras.cmake")
      EOF

requirements:
  host:
    - ament-index-python
    - rcutils
    - rosidl-cli
    - rosidl-cmake
    - rosidl-parser
    - rosidl-runtime-c
    - rosidl-typesupport-interface
  run:
    - ament-index-python
    - rcutils
    - rosidl-cli
    - rosidl-cmake
    - rosidl-parser
    - rosidl-runtime-c
    - rosidl-typesupport-interface

tests:
  - script:
      - test -f $PREFIX/share/rosidl_generator_c/package.xml
      - test -x $PREFIX/lib/rosidl_generator_c/rosidl_generator_c
      - $PREFIX/lib/rosidl_generator_c/rosidl_generator_c --help >/dev/null
      - test -f $PREFIX/share/rosidl_generator_c/cmake/rosidl_generator_cConfig.cmake
      - test -f $PREFIX/share/ament_index/resource_index/packages/rosidl_generator_c

# future requirements:
#   run:
#     - python

about:
  homepage: https://github.com/ros2/rosidl
  repository: https://github.com/ros2/rosidl
  summary: Generate ROS interfaces in C
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
