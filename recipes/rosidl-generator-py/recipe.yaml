context:
  name: "rosidl-generator-py"
  version: "0.14.6"
  git_rev: "3971c5f59606fa33097f0ad9c36b6438dbb0b523"
  source_dir: "rosidl_generator_py"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rosidl_python.git
  rev: ${{ git_rev }}

build:
  number: 6
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$(python3 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
    - mkdir -p "$SITE_PACKAGES" "$PREFIX/lib/rosidl_generator_py" "$PREFIX/share/rosidl_generator_py/cmake" "$PREFIX/share/rosidl_generator_py/resource" "$PREFIX/share/ament_index/resource_index/packages" "$PREFIX/share/ament_index/resource_index/rosidl_generator_packages"
    - cp -R rosidl_generator_py "$SITE_PACKAGES/"
    - cp package.xml "$PREFIX/share/rosidl_generator_py/package.xml"
    - cp bin/rosidl_generator_py "$PREFIX/lib/rosidl_generator_py/_rosidl_generator_py_entry.py"
    - |
      cat > "$PREFIX/lib/rosidl_generator_py/rosidl_generator_py" <<'EOF'
      #!/usr/bin/env python3
      import os
      import runpy
      import sys
      import sysconfig

      prefix = os.path.abspath(os.path.join(os.path.dirname(__file__), '..', '..'))
      site_packages = sysconfig.get_path(
          'purelib', scheme='posix_prefix',
          vars={'base': prefix, 'platbase': prefix})
      sys.path.insert(0, site_packages)
      entry = os.path.join(prefix, 'lib', 'rosidl_generator_py', '_rosidl_generator_py_entry.py')
      sys.argv[0] = entry
      runpy.run_path(entry, run_name='__main__')
      EOF
    - chmod +x "$PREFIX/lib/rosidl_generator_py/rosidl_generator_py" "$PREFIX/lib/rosidl_generator_py/_rosidl_generator_py_entry.py"
    - cp -R cmake "$PREFIX/share/rosidl_generator_py/"
    - cp -R resource "$PREFIX/share/rosidl_generator_py/"
    - |
      sed \
        -e "s#@PYTHON_INSTALL_DIR@#${SITE_PACKAGES#$PREFIX/}#g" \
        rosidl_generator_py-extras.cmake.in > "$PREFIX/share/rosidl_generator_py/cmake/rosidl_generator_py-extras.cmake"
    - mkdir -p "$SITE_PACKAGES/rosidl_generator_py-${{ version }}.dist-info"
    - |
      cat > "$SITE_PACKAGES/rosidl_generator_py-${{ version }}.dist-info/METADATA" <<'EOF'
      Metadata-Version: 2.1
      Name: rosidl-generator-py
      Version: ${{ version }}
      EOF
    - |
      cat > "$SITE_PACKAGES/rosidl_generator_py-${{ version }}.dist-info/entry_points.txt" <<'EOF'
      [rosidl_cli.command.generate.type_extensions]
      py = rosidl_generator_py.cli:GeneratePython
      EOF
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/rosidl_generator_py"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/rosidl_generator_packages/rosidl_generator_py"
    - |
      cat > "$PREFIX/share/rosidl_generator_py/cmake/rosidl_generator_pyConfig.cmake" <<'EOF'
      include_guard(GLOBAL)
      include("${CMAKE_CURRENT_LIST_DIR}/rosidl_generator_py_get_typesupports.cmake")
      include("${CMAKE_CURRENT_LIST_DIR}/rosidl_generator_py-extras.cmake")
      EOF

requirements:
  host:
    - ament-index-python
    - python-cmake-module
    - rosidl-cli
    - rosidl-generator-c
    - rosidl-parser
    - rosidl-runtime-c
    - rosidl-runtime-py
    - rosidl-typesupport-interface
    - rpyutils
  run:
    - ament-index-python
    - python-cmake-module
    - rosidl-cli
    - rosidl-generator-c
    - rosidl-parser
    - rosidl-runtime-c
    - rosidl-runtime-py
    - rosidl-typesupport-interface
    - rpyutils

tests:
  - script:
      - test -f $PREFIX/share/rosidl_generator_py/package.xml
      - test -x $PREFIX/lib/rosidl_generator_py/rosidl_generator_py
      - $PREFIX/lib/rosidl_generator_py/rosidl_generator_py --help >/dev/null
      - test -f $PREFIX/share/rosidl_generator_py/cmake/rosidl_generator_pyConfig.cmake
      - test -f $PREFIX/share/rosidl_generator_py/cmake/rosidl_generator_py_get_typesupports.cmake
      - test -f $PREFIX/lib/python3.13/site-packages/rosidl_generator_py/generate_py_impl.py

# future requirements:
#   run:
#     - numpy
#     - rosidl-typesupport-c

about:
  homepage: https://github.com/ros2/rosidl_python
  repository: https://github.com/ros2/rosidl_python
  summary: Generate ROS interfaces in Python
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
