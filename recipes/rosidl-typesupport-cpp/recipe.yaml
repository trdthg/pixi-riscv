context:
  name: "rosidl-typesupport-cpp"
  ros_name: "rosidl_typesupport_cpp"
  version: "2.0.2"
  git_rev: "94c7b6d6db353cf26adc22cb7023833fd6cd18a1"
  source_dir: "rosidl_typesupport_cpp"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rosidl_typesupport.git
  rev: ${{ git_rev }}

build:
  number: 2
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$($PREFIX/bin/python3.12 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
    - mkdir -p "$SITE_PACKAGES" "$PREFIX/include" "$PREFIX/lib/${{ ros_name }}" "$PREFIX/lib" "$PREFIX/share/${{ ros_name }}/cmake" "$PREFIX/share/${{ ros_name }}/resource" "$PREFIX/share/ament_index/resource_index/packages"
    - cp -R include/${{ ros_name }} "$PREFIX/include/"
    - cp -R ${{ ros_name }} "$SITE_PACKAGES/"
    - cp -R cmake "$PREFIX/share/${{ ros_name }}/"
    - cp -R resource "$PREFIX/share/${{ ros_name }}/"
    - cp bin/${{ ros_name }} "$PREFIX/lib/${{ ros_name }}/_${{ ros_name }}_entry.py"
    - |
      cat > "$PREFIX/lib/${{ ros_name }}/${{ ros_name }}" <<'EOF'
      #!/usr/bin/env python3
      import os
      import runpy
      import sys

      prefix = os.path.abspath(os.path.join(os.path.dirname(__file__), '..', '..'))
      sys.path.insert(0, os.path.join(prefix, 'lib', 'python3.12', 'site-packages'))
      entry = os.path.join(prefix, 'lib', 'rosidl_typesupport_cpp', '_rosidl_typesupport_cpp_entry.py')
      sys.argv[0] = entry
      runpy.run_path(entry, run_name='__main__')
      EOF
    - chmod +x "$PREFIX/lib/${{ ros_name }}/${{ ros_name }}" "$PREFIX/lib/${{ ros_name }}/_${{ ros_name }}_entry.py"
    - |
      c++ -std=c++14 -fPIC -DROSIDL_TYPESUPPORT_CPP_BUILDING_DLL \
        -Iinclude -Isrc -I"$PREFIX/include" \
        -shared src/identifier.cpp src/message_type_support_dispatch.cpp src/service_type_support_dispatch.cpp \
        -L"$PREFIX/lib" -lrosidl_typesupport_c -lrosidl_runtime_c -lrcpputils -lrcutils -ldl -Wl,-rpath,"$PREFIX/lib" \
        -o "$PREFIX/lib/lib${{ ros_name }}.so"
    - cp package.xml "$PREFIX/share/${{ ros_name }}/package.xml"
    - |
      sed \
        -e "s#@PYTHON_INSTALL_DIR@#${SITE_PACKAGES#$PREFIX/}#g" \
        -e "s#@rosidl_typesupport_cpp_LIBRARY_TYPE@#SHARED#g" \
        rosidl_typesupport_cpp-extras.cmake.in > "$PREFIX/share/${{ ros_name }}/cmake/rosidl_typesupport_cpp-extras.cmake"
    - mkdir -p "$SITE_PACKAGES/${{ ros_name }}-${{ version }}.dist-info"
    - |
      cat > "$SITE_PACKAGES/${{ ros_name }}-${{ version }}.dist-info/METADATA" <<'EOF'
      Metadata-Version: 2.1
      Name: rosidl-typesupport-cpp
      Version: ${{ version }}
      EOF
    - |
      cat > "$SITE_PACKAGES/${{ ros_name }}-${{ version }}.dist-info/entry_points.txt" <<'EOF'
      [rosidl_cli.command.generate.typesupport_extensions]
      cpp = rosidl_typesupport_cpp.cli:GenerateCppTypesupport
      EOF
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}"
    - |
      cat > "$PREFIX/share/${{ ros_name }}/cmake/rosidl_typesupport_cppConfig.cmake" <<'EOF'
      include_guard(GLOBAL)
      find_package(rcutils REQUIRED)
      find_package(rcpputils REQUIRED)
      find_package(rosidl_runtime_c REQUIRED)
      find_package(rosidl_runtime_cpp REQUIRED)
      find_package(rosidl_typesupport_c REQUIRED)
      find_package(rosidl_typesupport_interface REQUIRED)
      include("${CMAKE_CURRENT_LIST_DIR}/rosidl_typesupport_cppTargets.cmake")
      include("${CMAKE_CURRENT_LIST_DIR}/rosidl_typesupport_cpp-extras.cmake")
      set(rosidl_typesupport_cpp_LIBRARIES rosidl_typesupport_cpp::rosidl_typesupport_cpp)
      set(rosidl_typesupport_cpp_INCLUDE_DIRS "${CMAKE_CURRENT_LIST_DIR}/../../../include")
      EOF
    - |
      cat > "$PREFIX/share/${{ ros_name }}/cmake/rosidl_typesupport_cppTargets.cmake" <<'EOF'
      add_library(rosidl_typesupport_cpp::rosidl_typesupport_cpp SHARED IMPORTED)
      set_target_properties(rosidl_typesupport_cpp::rosidl_typesupport_cpp PROPERTIES
        IMPORTED_LOCATION "${CMAKE_CURRENT_LIST_DIR}/../../../lib/librosidl_typesupport_cpp.so"
        INTERFACE_INCLUDE_DIRECTORIES "${CMAKE_CURRENT_LIST_DIR}/../../../include"
        INTERFACE_LINK_LIBRARIES "rosidl_typesupport_c::rosidl_typesupport_c;rosidl_runtime_c::rosidl_runtime_c;rosidl_runtime_cpp::rosidl_runtime_cpp;rcpputils::rcpputils;rcutils::rcutils"
      )
      EOF

requirements:
  host:
    - ament-cmake-core
    - ament-index-python
    - python
    - rcutils
    - rcpputils
    - rosidl-cmake
    - rosidl-generator-cpp
    - rosidl-runtime-c
    - rosidl-runtime-cpp
    - rosidl-typesupport-c
    - rosidl-typesupport-interface
  run:
    - ament-cmake-core
    - ament-index-python
    - python
    - rcutils
    - rcpputils
    - rosidl-cmake
    - rosidl-generator-cpp
    - rosidl-runtime-c
    - rosidl-runtime-cpp
    - rosidl-typesupport-c
    - rosidl-typesupport-interface

# future requirements:
#   build:
#     - cxx-compiler
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/lib/librosidl_typesupport_cpp.so
      - test -f $PREFIX/include/rosidl_typesupport_cpp/identifier.hpp
      - test -x $PREFIX/lib/rosidl_typesupport_cpp/rosidl_typesupport_cpp
      - $PREFIX/bin/python3.12 -c "import rosidl_typesupport_cpp; print('rosidl_typesupport_cpp ok')"
      - $PREFIX/lib/rosidl_typesupport_cpp/rosidl_typesupport_cpp --help >/dev/null
      - test ! -e $PREFIX/share/ament_index/resource_index/rosidl_typesupport_cpp/rosidl_typesupport_cpp
      - |
        cat > test_typesupport_cpp.cpp <<'EOF'
        #include <cstring>
        #include <rosidl_typesupport_cpp/identifier.hpp>
        int main() {
          return std::strcmp(rosidl_typesupport_cpp::typesupport_identifier, "rosidl_typesupport_cpp");
        }
        EOF
      - c++ -std=c++14 -I$PREFIX/include test_typesupport_cpp.cpp -L$PREFIX/lib -lrosidl_typesupport_cpp -lrosidl_typesupport_c -lrosidl_runtime_c -lrcpputils -lrcutils -Wl,-rpath,$PREFIX/lib -o test_typesupport_cpp
      - ./test_typesupport_cpp

about:
  homepage: https://github.com/ros2/rosidl_typesupport
  repository: https://github.com/ros2/rosidl_typesupport
  summary: C++ dispatch layer for ROS interface type support
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
