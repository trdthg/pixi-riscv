context:
  name: "rosidl-typesupport-fastrtps-cpp"
  ros_name: "rosidl_typesupport_fastrtps_cpp"
  version: "2.2.2"
  git_rev: "db3130c64a65c06e1104e80eadccf196bfe080a3"
  source_dir: "rosidl_typesupport_fastrtps_cpp"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rosidl_typesupport_fastrtps.git
  rev: ${{ git_rev }}

build:
  number: 3
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$($PREFIX/bin/python3.12 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
    - mkdir -p "$SITE_PACKAGES" "$PREFIX/include" "$PREFIX/lib/${{ ros_name }}" "$PREFIX/lib" "$PREFIX/share/${{ ros_name }}/cmake" "$PREFIX/share/${{ ros_name }}/resource" "$PREFIX/share/ament_index/resource_index/packages" "$PREFIX/share/ament_index/resource_index/rosidl_typesupport_cpp" "$PREFIX/share/ament_index/resource_index/rosidl_runtime_packages"
    - cp -R include/${{ ros_name }} "$PREFIX/include/"
    - cp -R ${{ ros_name }} "$SITE_PACKAGES/"
    - cp -R cmake "$PREFIX/share/${{ ros_name }}/"
    - cp -R resource "$PREFIX/share/${{ ros_name }}/"
    - cp bin/${{ ros_name }} "$PREFIX/lib/${{ ros_name }}/_${{ ros_name }}_entry.py"
    - |
      cat > "$PREFIX/lib/${{ ros_name }}/${{ ros_name }}" <<'EOF'
      #!/usr/bin/env python3
      import os
      import runpy
      import sys

      prefix = os.path.abspath(os.path.join(os.path.dirname(__file__), '..', '..'))
      sys.path.insert(0, os.path.join(prefix, 'lib', 'python3.12', 'site-packages'))
      entry = os.path.join(prefix, 'lib', 'rosidl_typesupport_fastrtps_cpp', '_rosidl_typesupport_fastrtps_cpp_entry.py')
      sys.argv[0] = entry
      runpy.run_path(entry, run_name='__main__')
      EOF
    - chmod +x "$PREFIX/lib/${{ ros_name }}/${{ ros_name }}" "$PREFIX/lib/${{ ros_name }}/_${{ ros_name }}_entry.py"
    - |
      c++ -std=c++14 -fPIC -DROSIDL_TYPESUPPORT_FASTRTPS_CPP_BUILDING_DLL \
        -Iinclude -I"$PREFIX/include" \
        -shared src/identifier.cpp src/wstring_conversion.cpp \
        -L"$PREFIX/lib" -lfastcdr -lrmw -lrosidl_runtime_c -Wl,-rpath,"$PREFIX/lib" \
        -o "$PREFIX/lib/lib${{ ros_name }}.so"
    - cp package.xml "$PREFIX/share/${{ ros_name }}/package.xml"
    - |
      sed \
        -e "s#@PYTHON_INSTALL_DIR@#${SITE_PACKAGES#$PREFIX/}#g" \
        rosidl_typesupport_fastrtps_cpp-extras.cmake.in > "$PREFIX/share/${{ ros_name }}/cmake/rosidl_typesupport_fastrtps_cpp-extras.cmake"
    - mkdir -p "$SITE_PACKAGES/${{ ros_name }}-${{ version }}.dist-info"
    - |
      cat > "$SITE_PACKAGES/${{ ros_name }}-${{ version }}.dist-info/METADATA" <<'EOF'
      Metadata-Version: 2.1
      Name: rosidl-typesupport-fastrtps-cpp
      Version: ${{ version }}
      EOF
    - |
      cat > "$SITE_PACKAGES/${{ ros_name }}-${{ version }}.dist-info/entry_points.txt" <<'EOF'
      [rosidl_cli.command.generate.typesupport_extensions]
      fastrtps_cpp = rosidl_typesupport_fastrtps_cpp.cli:GenerateFastRTPSCppTypesupport
      EOF
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/rosidl_typesupport_cpp/${{ ros_name }}"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/rosidl_runtime_packages/${{ ros_name }}"
    - |
      cat > "$PREFIX/share/${{ ros_name }}/cmake/rosidl_typesupport_fastrtps_cppConfig.cmake" <<'EOF'
      include_guard(GLOBAL)
      find_package(ament_cmake_core REQUIRED)
      find_package(ament_cmake_ros REQUIRED)
      find_package(fastrtps_cmake_module REQUIRED)
      find_package(fastcdr REQUIRED CONFIG)
      find_package(rmw REQUIRED)
      find_package(rosidl_cmake REQUIRED)
      find_package(rosidl_generator_cpp REQUIRED)
      find_package(rosidl_runtime_c REQUIRED)
      find_package(rosidl_runtime_cpp REQUIRED)
      find_package(rosidl_typesupport_interface REQUIRED)
      include("${CMAKE_CURRENT_LIST_DIR}/rosidl_typesupport_fastrtps_cppTargets.cmake")
      include("${CMAKE_CURRENT_LIST_DIR}/rosidl_typesupport_fastrtps_cpp-extras.cmake")
      set(rosidl_typesupport_fastrtps_cpp_LIBRARIES rosidl_typesupport_fastrtps_cpp::rosidl_typesupport_fastrtps_cpp)
      set(rosidl_typesupport_fastrtps_cpp_INCLUDE_DIRS "${CMAKE_CURRENT_LIST_DIR}/../../../include")
      EOF
    - |
      cat > "$PREFIX/share/${{ ros_name }}/cmake/rosidl_typesupport_fastrtps_cppTargets.cmake" <<'EOF'
      if(NOT TARGET rosidl_typesupport_fastrtps_cpp::rosidl_typesupport_fastrtps_cpp)
        add_library(rosidl_typesupport_fastrtps_cpp::rosidl_typesupport_fastrtps_cpp SHARED IMPORTED)
        set_target_properties(rosidl_typesupport_fastrtps_cpp::rosidl_typesupport_fastrtps_cpp PROPERTIES
          IMPORTED_LOCATION "${CMAKE_CURRENT_LIST_DIR}/../../../lib/librosidl_typesupport_fastrtps_cpp.so"
          INTERFACE_INCLUDE_DIRECTORIES "${CMAKE_CURRENT_LIST_DIR}/../../../include"
          INTERFACE_LINK_LIBRARIES "fastcdr;rmw::rmw;rosidl_runtime_c::rosidl_runtime_c;rosidl_runtime_cpp::rosidl_runtime_cpp"
        )
      endif()
      EOF

requirements:
  host:
    - ament-cmake-core
    - ament-cmake-ros
    - ament-index-python
    - python
    - fastcdr
    - fastrtps-cmake-module
    - rmw
    - rosidl-cmake
    - rosidl-cli
    - rosidl-generator-cpp
    - rosidl-runtime-c
    - rosidl-runtime-cpp
    - rosidl-typesupport-interface
  run:
    - ament-cmake-core
    - ament-cmake-ros
    - ament-index-python
    - python
    - fastcdr
    - fastrtps-cmake-module
    - rmw
    - rosidl-cmake
    - rosidl-cli
    - rosidl-generator-cpp
    - rosidl-runtime-c
    - rosidl-runtime-cpp
    - rosidl-typesupport-interface

# future requirements:
#   build:
#     - cxx-compiler
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/lib/librosidl_typesupport_fastrtps_cpp.so
      - test -f $PREFIX/include/rosidl_typesupport_fastrtps_cpp/identifier.hpp
      - test -f $PREFIX/include/rosidl_typesupport_fastrtps_cpp/message_type_support_decl.hpp
      - test -x $PREFIX/lib/rosidl_typesupport_fastrtps_cpp/rosidl_typesupport_fastrtps_cpp
      - $PREFIX/bin/python3.12 -c "import rosidl_typesupport_fastrtps_cpp; print('rosidl_typesupport_fastrtps_cpp ok')"
      - $PREFIX/lib/rosidl_typesupport_fastrtps_cpp/rosidl_typesupport_fastrtps_cpp --help >/dev/null
      - test -f $PREFIX/share/ament_index/resource_index/rosidl_typesupport_cpp/rosidl_typesupport_fastrtps_cpp
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_rosidl_typesupport_fastrtps_cpp_config CXX)
        find_package(rosidl_typesupport_fastrtps_cpp REQUIRED)
        find_package(rosidl_typesupport_fastrtps_cpp REQUIRED)
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - |
        cat > test_fastrtps_cpp.cpp <<'EOF'
        #include <cstring>
        #include <rosidl_typesupport_fastrtps_cpp/identifier.hpp>
        int main() {
          return std::strcmp(rosidl_typesupport_fastrtps_cpp::typesupport_identifier, "rosidl_typesupport_fastrtps_cpp");
        }
        EOF
      - c++ -std=c++14 -I$PREFIX/include test_fastrtps_cpp.cpp -L$PREFIX/lib -lrosidl_typesupport_fastrtps_cpp -lfastcdr -lrmw -lrosidl_runtime_c -Wl,-rpath,$PREFIX/lib -o test_fastrtps_cpp
      - ./test_fastrtps_cpp

about:
  homepage: https://github.com/ros2/rosidl_typesupport_fastrtps
  repository: https://github.com/ros2/rosidl_typesupport_fastrtps
  summary: C++ Fast RTPS/Fast DDS type support generator for ROS interfaces
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
