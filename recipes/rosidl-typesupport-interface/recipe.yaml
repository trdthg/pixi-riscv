context:
  name: "rosidl-typesupport-interface"
  version: "3.1.8"
  git_rev: "8cdfe315157f8bffa9b73b6750c52f44325a7847"
  source_dir: "rosidl_typesupport_interface"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rosidl.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - cd ${{ source_dir }}
    - mkdir -p "$PREFIX/include" "$PREFIX/share/rosidl_typesupport_interface/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - cp -R include/rosidl_typesupport_interface "$PREFIX/include/"
    - cp package.xml "$PREFIX/share/rosidl_typesupport_interface/package.xml"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/rosidl_typesupport_interface"
    - |
      cat > "$PREFIX/share/rosidl_typesupport_interface/cmake/rosidl_typesupport_interfaceConfig.cmake" <<'EOF'
      add_library(rosidl_typesupport_interface::rosidl_typesupport_interface INTERFACE IMPORTED)
      set_target_properties(rosidl_typesupport_interface::rosidl_typesupport_interface PROPERTIES
        INTERFACE_INCLUDE_DIRECTORIES "${CMAKE_CURRENT_LIST_DIR}/../../../include"
      )
      set(rosidl_typesupport_interface_INCLUDE_DIRS "${CMAKE_CURRENT_LIST_DIR}/../../../include")
      EOF

tests:
  - script:
      - test -f $PREFIX/include/rosidl_typesupport_interface/macros.h
      - test -f $PREFIX/share/ament_index/resource_index/packages/rosidl_typesupport_interface

about:
  homepage: https://github.com/ros2/rosidl
  repository: https://github.com/ros2/rosidl
  summary: Interface macros for rosidl typesupport packages
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
