context:
  name: "rosidl-typesupport-introspection-c"
  ros_name: "rosidl_typesupport_introspection_c"
  version: "3.1.8"
  git_rev: "703d80c8b39cc8db5868a7805186c9ff23367bf5"
  source_dir: "rosidl_typesupport_introspection_c"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/rosidl.git
  rev: ${{ git_rev }}

build:
  number: 2
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$($PREFIX/bin/python3.12 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
    - mkdir -p "$SITE_PACKAGES" "$PREFIX/include" "$PREFIX/lib/${{ ros_name }}" "$PREFIX/lib" "$PREFIX/share/${{ ros_name }}/cmake" "$PREFIX/share/${{ ros_name }}/resource" "$PREFIX/share/ament_index/resource_index/packages" "$PREFIX/share/ament_index/resource_index/rosidl_typesupport_c" "$PREFIX/share/ament_index/resource_index/rosidl_runtime_packages"
    - cp -R include/${{ ros_name }} "$PREFIX/include/"
    - cp -R ${{ ros_name }} "$SITE_PACKAGES/"
    - cp -R cmake "$PREFIX/share/${{ ros_name }}/"
    - cp -R resource "$PREFIX/share/${{ ros_name }}/"
    - cp bin/${{ ros_name }} "$PREFIX/lib/${{ ros_name }}/_${{ ros_name }}_entry.py"
    - |
      cat > "$PREFIX/lib/${{ ros_name }}/${{ ros_name }}" <<'EOF'
      #!/usr/bin/env python3
      import os
      import runpy
      import sys

      prefix = os.path.abspath(os.path.join(os.path.dirname(__file__), '..', '..'))
      sys.path.insert(0, os.path.join(prefix, 'lib', 'python3.12', 'site-packages'))
      entry = os.path.join(prefix, 'lib', 'rosidl_typesupport_introspection_c', '_rosidl_typesupport_introspection_c_entry.py')
      sys.argv[0] = entry
      runpy.run_path(entry, run_name='__main__')
      EOF
    - chmod +x "$PREFIX/lib/${{ ros_name }}/${{ ros_name }}" "$PREFIX/lib/${{ ros_name }}/_${{ ros_name }}_entry.py"
    - |
      cc -std=c11 -fPIC -DROSIDL_TYPESUPPORT_INTROSPECTION_C_BUILDING_DLL \
        -Iinclude -I"$PREFIX/include" \
        -shared src/identifier.c \
        -o "$PREFIX/lib/lib${{ ros_name }}.so"
    - cp package.xml "$PREFIX/share/${{ ros_name }}/package.xml"
    - |
      sed \
        -e "s#@PYTHON_INSTALL_DIR@#${SITE_PACKAGES#$PREFIX/}#g" \
        -e "s#@rosidl_typesupport_introspection_c_LIBRARY_TYPE@#SHARED#g" \
        rosidl_typesupport_introspection_c-extras.cmake.in > "$PREFIX/share/${{ ros_name }}/cmake/rosidl_typesupport_introspection_c-extras.cmake"
    - mkdir -p "$SITE_PACKAGES/${{ ros_name }}-${{ version }}.dist-info"
    - |
      cat > "$SITE_PACKAGES/${{ ros_name }}-${{ version }}.dist-info/METADATA" <<'EOF'
      Metadata-Version: 2.1
      Name: rosidl-typesupport-introspection-c
      Version: ${{ version }}
      EOF
    - |
      cat > "$SITE_PACKAGES/${{ ros_name }}-${{ version }}.dist-info/entry_points.txt" <<'EOF'
      [rosidl_cli.command.generate.typesupport_extensions]
      introspection_c = rosidl_typesupport_introspection_c.cli:GenerateIntrospectionCTypesupport
      EOF
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/rosidl_typesupport_c/${{ ros_name }}"
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/rosidl_runtime_packages/${{ ros_name }}"
    - |
      cat > "$PREFIX/share/${{ ros_name }}/cmake/rosidl_typesupport_introspection_cConfig.cmake" <<'EOF'
      include_guard(GLOBAL)
      find_package(ament_cmake_core REQUIRED)
      find_package(rosidl_cmake REQUIRED)
      find_package(rosidl_runtime_c REQUIRED)
      find_package(rosidl_generator_c REQUIRED)
      include("${CMAKE_CURRENT_LIST_DIR}/rosidl_typesupport_introspection_cTargets.cmake")
      include("${CMAKE_CURRENT_LIST_DIR}/rosidl_typesupport_introspection_c-extras.cmake")
      set(rosidl_typesupport_introspection_c_LIBRARIES rosidl_typesupport_introspection_c::rosidl_typesupport_introspection_c)
      set(rosidl_typesupport_introspection_c_INCLUDE_DIRS "${CMAKE_CURRENT_LIST_DIR}/../../../include")
      EOF
    - |
      cat > "$PREFIX/share/${{ ros_name }}/cmake/rosidl_typesupport_introspection_cTargets.cmake" <<'EOF'
      if(NOT TARGET rosidl_typesupport_introspection_c::rosidl_typesupport_introspection_c)
        add_library(rosidl_typesupport_introspection_c::rosidl_typesupport_introspection_c SHARED IMPORTED)
        set_target_properties(rosidl_typesupport_introspection_c::rosidl_typesupport_introspection_c PROPERTIES
          IMPORTED_LOCATION "${CMAKE_CURRENT_LIST_DIR}/../../../lib/librosidl_typesupport_introspection_c.so"
          INTERFACE_INCLUDE_DIRECTORIES "${CMAKE_CURRENT_LIST_DIR}/../../../include"
          INTERFACE_LINK_LIBRARIES "rosidl_runtime_c::rosidl_runtime_c"
        )
      endif()
      EOF

requirements:
  host:
    - ament-cmake-core
    - ament-index-python
    - python
    - rosidl-cmake
    - rosidl-cli
    - rosidl-generator-c
    - rosidl-parser
    - rosidl-runtime-c
  run:
    - ament-cmake-core
    - ament-index-python
    - python
    - rosidl-cmake
    - rosidl-cli
    - rosidl-generator-c
    - rosidl-parser
    - rosidl-runtime-c

# future requirements:
#   build:
#     - c-compiler

tests:
  - script:
      - test -f $PREFIX/lib/librosidl_typesupport_introspection_c.so
      - test -f $PREFIX/include/rosidl_typesupport_introspection_c/identifier.h
      - test -f $PREFIX/include/rosidl_typesupport_introspection_c/message_introspection.h
      - test -x $PREFIX/lib/rosidl_typesupport_introspection_c/rosidl_typesupport_introspection_c
      - $PREFIX/bin/python3.12 -c "import rosidl_typesupport_introspection_c; print('rosidl_typesupport_introspection_c ok')"
      - $PREFIX/lib/rosidl_typesupport_introspection_c/rosidl_typesupport_introspection_c --help >/dev/null
      - test -f $PREFIX/share/ament_index/resource_index/rosidl_typesupport_c/rosidl_typesupport_introspection_c
      - test -f $PREFIX/share/ament_index/resource_index/rosidl_runtime_packages/rosidl_typesupport_introspection_c
      - |
        cat > test_introspection_c.c <<'EOF'
        #include <string.h>
        #include <rosidl_typesupport_introspection_c/identifier.h>
        int main(void) {
          return strcmp(rosidl_typesupport_introspection_c__identifier, "rosidl_typesupport_introspection_c");
        }
        EOF
      - cc -std=c11 -I$PREFIX/include test_introspection_c.c -L$PREFIX/lib -lrosidl_typesupport_introspection_c -Wl,-rpath,$PREFIX/lib -o test_introspection_c
      - ./test_introspection_c

about:
  homepage: https://github.com/ros2/rosidl
  repository: https://github.com/ros2/rosidl
  summary: C introspection type support for ROS interfaces
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
