context:
  name: "spdlog-vendor"
  ros_name: "spdlog_vendor"
  version: "1.3.1"

package:
  name: ${{ name }}
  version: ${{ version }}

build:
  number: 0
  script:
    - mkdir -p "$PREFIX/share/${{ ros_name }}/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - |
      cat > "$PREFIX/share/${{ ros_name }}/package.xml" <<'EOF'
      <?xml version="1.0"?>
      <package format="3">
        <name>spdlog_vendor</name>
        <version>${{ version }}</version>
        <description>Vendor shim for system spdlog.</description>
        <maintainer email="noreply@example.com">pixi-riscv</maintainer>
        <license>Apache-2.0</license>
        <export><build_type>ament_cmake</build_type></export>
      </package>
      EOF
    - |
      cat > "$PREFIX/share/${{ ros_name }}/cmake/spdlog_vendorConfig.cmake" <<'EOF'
      include_guard(GLOBAL)
      find_package(spdlog REQUIRED)
      EOF
    - printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}"

requirements:
  host:
    - spdlog
  run:
    - spdlog

# future requirements:
#   build:
#     - cmake

tests:
  - script:
      - test -f $PREFIX/share/${{ ros_name }}/cmake/spdlog_vendorConfig.cmake
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_spdlog_vendor CXX)
        find_package(spdlog_vendor REQUIRED)
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX

about:
  homepage: https://github.com/ros2/spdlog_vendor
  summary: ROS vendor shim for spdlog
  license: Apache-2.0

extra:
  recipe-maintainers:
    - trdthg
