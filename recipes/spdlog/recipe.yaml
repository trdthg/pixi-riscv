context:
  name: "spdlog"
  version: "1.12.0"
  sha256: "4dccf2d10f410c1e2feaff89966bfc49a1abb29ef6f08246335b110e001e09a9"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/gabime/spdlog/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 3
  script:
    - mkdir -p build
    - cd build
    - cmake .. -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DSPDLOG_FMT_EXTERNAL=ON -DSPDLOG_BUILD_EXAMPLE=OFF -DSPDLOG_BUILD_EXAMPLES=OFF -DSPDLOG_BUILD_TESTS=OFF -DSPDLOG_BUILD_TESTS_HO=OFF -DSPDLOG_BUILD_BENCH=OFF
    - cmake --build . --target install -- -j"$(nproc)"
    - mkdir -p "$PREFIX/share/ament_index/resource_index/packages"
    - printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/spdlog"

requirements:
  build:
    - patchelf
    - cmake
    - ${{ compiler("cxx") }}
    - make
  host:
    - fmt
  run:
    - fmt

tests:
  - script:
      - test -f $PREFIX/include/spdlog/spdlog.h
      - test -f $PREFIX/lib/cmake/spdlog/spdlogConfig.cmake
      - |
        if ! ls "$PREFIX"/lib/libspdlog.so* >/dev/null 2>&1; then
          echo "missing spdlog shared library"
          exit 1
        fi
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_spdlog CXX)
        find_package(spdlog REQUIRED)
        add_executable(test_spdlog test_spdlog.cpp)
        target_link_libraries(test_spdlog PRIVATE spdlog::spdlog)
        EOF
      - |
        cat > test_spdlog.cpp <<'EOF'
        #include <spdlog/spdlog.h>
        int main() {
          spdlog::info("test");
          return 0;
        }
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - cmake --build build
      - ./build/test_spdlog
    requirements:
      run:
        - cmake
        - gxx_linux-riscv64
        - make

about:
  homepage: https://github.com/gabime/spdlog
  repository: https://github.com/gabime/spdlog
  summary: Fast C++ logging library
  license: MIT

extra:
  recipe-maintainers:
    - trdthg
