context:
  name: "spdlog"
  version: "1.12.0"

package:
  name: ${{ name }}
  version: ${{ version }}

build:
  number: 0
  script:
    - mkdir -p "$PREFIX/share/spdlog/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - |
      cat > "$PREFIX/share/spdlog/cmake/spdlogConfig.cmake" <<'EOF'
      include_guard(GLOBAL)
      find_package(fmt REQUIRED)
      find_path(spdlog_INCLUDE_DIR spdlog/spdlog.h)
      find_library(spdlog_LIBRARY spdlog)
      if(NOT spdlog_INCLUDE_DIR OR NOT spdlog_LIBRARY)
        message(FATAL_ERROR "system spdlog headers/library not found")
      endif()
      if(NOT TARGET spdlog::spdlog)
        add_library(spdlog::spdlog UNKNOWN IMPORTED)
        set_target_properties(spdlog::spdlog PROPERTIES
          IMPORTED_LOCATION "${spdlog_LIBRARY}"
          INTERFACE_INCLUDE_DIRECTORIES "${spdlog_INCLUDE_DIR}"
          INTERFACE_LINK_LIBRARIES "fmt::fmt"
        )
      endif()
      set(spdlog_FOUND TRUE)
      set(spdlog_INCLUDE_DIRS "${spdlog_INCLUDE_DIR}")
      set(spdlog_LIBRARIES "${spdlog_LIBRARY}")
      EOF
    - printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/spdlog"

requirements:
  host:
    - fmt
  run:
    - fmt

# This bootstrap recipe intentionally uses the system spdlog available on the
# riscv runner. Enable these dependencies once the riscv channel has spdlog.
# requirements:
#   build:
#     - cxx-compiler
#   run:
#     - spdlog

tests:
  - script:
      - test -f $PREFIX/share/spdlog/cmake/spdlogConfig.cmake
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_spdlog CXX)
        find_package(spdlog REQUIRED)
        add_executable(test_spdlog test_spdlog.cpp)
        target_link_libraries(test_spdlog PRIVATE spdlog::spdlog)
        EOF
      - |
        cat > test_spdlog.cpp <<'EOF'
        #include <spdlog/spdlog.h>
        int main() {
          spdlog::info("test");
          return 0;
        }
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - cmake --build build
      - ./build/test_spdlog

about:
  homepage: https://github.com/gabime/spdlog
  summary: CMake shim for system spdlog
  license: MIT

extra:
  recipe-maintainers:
    - trdthg
