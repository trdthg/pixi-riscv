context:
  name: "std-msgs"
  ros_name: "std_msgs"
  version: "4.9.1"
  git_rev: "c3072dba174f18d41b64fcbbb20bed47a86e9898"
  source_dir: "std_msgs"
  interface_files: "msg/Bool.msg msg/Byte.msg msg/ByteMultiArray.msg msg/Char.msg msg/ColorRGBA.msg msg/Empty.msg msg/Float32.msg msg/Float32MultiArray.msg msg/Float64.msg msg/Float64MultiArray.msg msg/Header.msg msg/Int16.msg msg/Int16MultiArray.msg msg/Int32.msg msg/Int32MultiArray.msg msg/Int64.msg msg/Int64MultiArray.msg msg/Int8.msg msg/Int8MultiArray.msg msg/MultiArrayDimension.msg msg/MultiArrayLayout.msg msg/String.msg msg/UInt16.msg msg/UInt16MultiArray.msg msg/UInt32.msg msg/UInt32MultiArray.msg msg/UInt64.msg msg/UInt64MultiArray.msg msg/UInt8.msg msg/UInt8MultiArray.msg"
  recursive_dependencies: "builtin_interfaces"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/common_interfaces.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$(python3 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
    - mkdir -p "$SITE_PACKAGES" "$PREFIX/share/${{ ros_name }}/cmake" "$PREFIX/share/ament_index/resource_index/packages" "$PREFIX/share/ament_index/resource_index/rosidl_interfaces"
    - cp package.xml "$PREFIX/share/${{ ros_name }}/package.xml"
    - mkdir -p /tmp/${{ ros_name }}_idl
    - |
      python3 - <<'PY'
      from pathlib import Path

      primitive_map = {
          'bool': 'boolean',
          'byte': 'octet',
          'char': 'uint8',
          'float32': 'float',
          'float64': 'double',
          'int8': 'int8',
          'uint8': 'uint8',
          'int16': 'int16',
          'uint16': 'uint16',
          'int32': 'int32',
          'uint32': 'uint32',
          'int64': 'int64',
          'uint64': 'uint64',
          'string': 'string',
      }

      def split_comment(line):
          return line.split('#', 1)[0].strip()

      def idl_type(type_name):
          suffix = ''
          if type_name.endswith('[]'):
              type_name = type_name[:-2]
              suffix = '[]'
          elif '[' in type_name and type_name.endswith(']'):
              base, bound = type_name[:-1].split('[', 1)
              type_name = base
              suffix = f'[{bound}]'
          if '/' in type_name:
              pkg, name = type_name.split('/', 1)
              value = f'{pkg}::msg::{name}'
          else:
              value = primitive_map.get(type_name, f'{pkg_name}::msg::{type_name}')
          if suffix == '[]':
              return f'sequence<{value}>'
          if suffix.startswith('['):
              return f'{value}{suffix}'
          return value

      def include_for(type_name):
          while type_name.endswith('[]') or ('[' in type_name and type_name.endswith(']')):
              if type_name.endswith('[]'):
                  type_name = type_name[:-2]
              else:
                  type_name = type_name[:type_name.rfind('[')]
          if '/' in type_name:
              pkg, name = type_name.split('/', 1)
              return f'#include "{pkg}/msg/{name}.idl"'
          if type_name not in primitive_map and type_name[:1].isupper():
              return f'#include "{pkg_name}/msg/{type_name}.idl"'
          return None

      def parse_fields(lines):
          includes, constants, fields = set(), [], []
          for raw in lines:
              line = split_comment(raw)
              if not line:
                  continue
              parts = line.split()
              if len(parts) < 2:
                  continue
              type_name, name = parts[0], parts[1]
              inc = include_for(type_name)
              if inc:
                  includes.add(inc)
              if '=' in name:
                  name, value = name.split('=', 1)
                  constants.append((idl_type(type_name), name, value))
              elif len(parts) >= 3 and parts[2] == '=':
                  constants.append((idl_type(type_name), name, parts[3]))
              else:
                  fields.append((idl_type(type_name), name))
          return sorted(includes), constants, fields

      def render_msg(rel, lines):
          name = Path(rel).stem
          includes, constants, fields = parse_fields(lines)
          body = []
          body.extend(includes)
          if includes:
              body.append('')
          body.extend([
              f'module {pkg_name} ' + chr(123),
              '  module msg {',
          ])
          if constants:
              body.append(f'    module {name}_Constants ' + chr(123))
              for typ, const_name, value in constants:
                  body.append(f'      const {typ} {const_name} = {value};')
              body.append('    };')
          body.append(f'    struct {name} ' + chr(123))
          for typ, field_name in fields:
              body.append(f'      {typ} {field_name};')
          body.extend(['    };', '  };', '};', ''])
          return '\n'.join(body)

      def split_srv(text):
          before, sep, after = text.partition('---')
          return before.splitlines(), after.splitlines() if sep else []

      def render_srv(rel, text):
          name = Path(rel).stem
          request_lines, response_lines = split_srv(text)
          req_includes, req_constants, req_fields = parse_fields(request_lines)
          res_includes, res_constants, res_fields = parse_fields(response_lines)
          body = []
          includes = sorted(set(req_includes) | set(res_includes))
          body.extend(includes)
          if includes:
              body.append('')
          body.extend([f'module {pkg_name} ' + chr(123), '  module srv ' + chr(123)])
          body.append(f'    struct {name}_Request ' + chr(123))
          for typ, field_name in req_fields:
              body.append(f'      {typ} {field_name};')
          body.append('    };')
          if res_constants:
              body.append(f'    module {name}_Response_Constants ' + chr(123))
              for typ, const_name, value in res_constants:
                  body.append(f'      const {typ} {const_name} = {value};')
              body.append('    };')
          body.append(f'    struct {name}_Response ' + chr(123))
          for typ, field_name in res_fields:
              body.append(f'      {typ} {field_name};')
          body.extend(['    };', '  };', '};', ''])
          return '\n'.join(body)

      pkg_name = '${{ ros_name }}'
      files = "${{ interface_files }}".split()
      out_base = Path('/tmp/${{ ros_name }}_idl')
      tuples = []
      for rel in files:
          src = Path(rel)
          out = out_base / src.with_suffix('.idl')
          out.parent.mkdir(parents=True, exist_ok=True)
          if src.suffix == '.srv':
              out.write_text(render_srv(rel, src.read_text()))
          else:
              out.write_text(render_msg(rel, src.read_text().splitlines()))
          tuples.append(f'{out_base}:{out.relative_to(out_base)}')
      Path('/tmp/${{ ros_name }}_idl_tuples.txt').write_text('\n'.join(tuples) + '\n')
      PY
    - |
      for path in ${{ interface_files }}; do
        mkdir -p "$PREFIX/share/${{ ros_name }}/$(dirname "$path")"
        cp "$path" "$PREFIX/share/${{ ros_name }}/$path"
      done
    - |
      while IFS= read -r tuple; do
        rel="${tuple#*:}"
        mkdir -p "$PREFIX/share/${{ ros_name }}/$(dirname "$rel")"
        cp "/tmp/${{ ros_name }}_idl/$rel" "$PREFIX/share/${{ ros_name }}/$rel"
      done < /tmp/${{ ros_name }}_idl_tuples.txt
    - |
      cp /tmp/${{ ros_name }}_idl_tuples.txt /tmp/${{ ros_name }}_idl_tuples_rel.txt
      sed -i 's#^.*/tmp/${{ ros_name }}_idl:##' /tmp/${{ ros_name }}_idl_tuples_rel.txt
      { cat /tmp/${{ ros_name }}_idl_tuples_rel.txt; printf '%s\n' ${{ interface_files }}; } | sort > "$PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}"
    - |
      IDL_FILES=$(paste -sd ';' /tmp/${{ ros_name }}_idl_tuples_rel.txt)
      INTERFACE_FILES=$(printf '%s\n' ${{ interface_files }} | paste -sd ';')
      cat > "$PREFIX/share/${{ ros_name }}/cmake/rosidl_cmake-extras.cmake" <<EOF
      set(${{ ros_name }}_IDL_FILES "${IDL_FILES}")
      set(${{ ros_name }}_INTERFACE_FILES "${INTERFACE_FILES}")
      set(${{ ros_name }}_RECURSIVE_DEPENDENCIES "${{ recursive_dependencies }}")
      set(${{ ros_name }}_TARGETS "")
      EOF
    - |
      cat > "$PREFIX/share/${{ ros_name }}/cmake/${{ ros_name }}Config.cmake" <<EOF
      set(${{ ros_name }}_FOUND_AMENT_PACKAGE TRUE)
      include("\${CMAKE_CURRENT_LIST_DIR}/rosidl_cmake-extras.cmake")
      EOF
    - |
      printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}"

requirements:
  host:
    - builtin-interfaces
  run:
    - builtin-interfaces

# future requirements:
#   run:
#     - python
#     - rosidl-generator-py

tests:
  - script:
      - test -f $PREFIX/share/${{ ros_name }}/package.xml
      - test -f $PREFIX/share/${{ ros_name }}/cmake/${{ ros_name }}Config.cmake
      - test -f $PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}
      - test -f $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - test -f $PREFIX/share/${{ ros_name }}/msg/Bool.msg
      - test -f $PREFIX/share/${{ ros_name }}/msg/Bool.idl
      - grep -q 'msg/Bool.idl' $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.16)
        project(test_${{ ros_name }})
        find_package(${{ ros_name }} REQUIRED)
        if(NOT "msg/Bool.idl" IN_LIST ${{ ros_name }}_IDL_FILES)
          message(FATAL_ERROR "missing msg/Bool.idl")
        endif()
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX

about:
  homepage: https://github.com/ros2/common_interfaces
  repository: https://github.com/ros2/common_interfaces
  summary: Standard primitive and array messages for ROS 2
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
