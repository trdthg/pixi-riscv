context:
  name: "std-msgs"
  ros_name: "std_msgs"
  version: "4.9.1"
  git_rev: "c3072dba174f18d41b64fcbbb20bed47a86e9898"
  source_dir: "std_msgs"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/common_interfaces.git
  rev: ${{ git_rev }}

build:
  number: 1
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$(python3 -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
      export PYTHONPATH="$SITE_PACKAGES${PYTHONPATH:+:$PYTHONPATH}"
    - cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
    - cmake --build build --target install -- -j"$(nproc)"

requirements:
  build:
    - patchelf
  host:
    - ament-cmake
    - builtin-interfaces
    - rosidl-default-generators
    - setuptools
  run:
    - ament-cmake
    - builtin-interfaces
    - rosidl-default-runtime

# This recipe intentionally uses host cmake and compiler on the native riscv runner.
# future requirements:
#   build:
#     - c-compiler
#     - cxx-compiler
#     - cmake
#     - make
#   host:
#     - python
#   run:
#     - libstdcxx
#     - python

tests:
  - script:
      - test -f $PREFIX/share/${{ ros_name }}/msg/Header.msg
      - test -f $PREFIX/share/${{ ros_name }}/msg/Header.idl
      - test -f $PREFIX/share/${{ ros_name }}/msg/String.msg
      - test -f $PREFIX/share/${{ ros_name }}/msg/String.idl
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/header.h
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/header.hpp
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/string.h
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/string.hpp
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_generator_c.so
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_typesupport_c.so
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_typesupport_cpp.so
      - test -f $PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}
      - test -f $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - grep -q 'msg/Header.idl' $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.16)
        project(test_std_msgs C CXX)
        find_package(std_msgs REQUIRED)
        if(NOT "msg/Header.idl" IN_LIST std_msgs_IDL_FILES)
          message(FATAL_ERROR "missing Header.idl")
        endif()
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - |
        cat > test_std_msgs.cpp <<'EOF'
        #include <std_msgs/msg/header.hpp>
        #include <std_msgs/msg/string.hpp>
        int main() {
          std_msgs::msg::Header header;
          std_msgs::msg::String text;
          header.frame_id = "map";
          text.data = "ok";
          return header.frame_id == "map" && text.data == "ok" ? 0 : 1;
        }
        EOF
      - c++ -std=c++14 -I$PREFIX/include -I$PREFIX/include/std_msgs -I$PREFIX/include/builtin_interfaces test_std_msgs.cpp -o test_std_msgs
      - ./test_std_msgs

about:
  homepage: https://github.com/ros2/common_interfaces
  repository: https://github.com/ros2/common_interfaces
  summary: Standard primitive and common message definitions for ROS 2
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
