context:
  name: "tinyxml2"
  version: "9.0.0"
  git_rev: "1dee28e51f9175a31955b9791c74c430fe13dc82"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/leethomason/tinyxml2.git
  rev: ${{ git_rev }}

build:
  number: 0
  script:
    - mkdir -p build
    - cd build
    - cmake .. -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -Dtinyxml2_BUILD_TESTING=OFF
    - cmake --build . --target install -- -j"$(nproc)"

requirements:
  build:
    - ${{ compiler("cxx") }}
    - cmake
    - make

tests:
  - script:
      - test -f $PREFIX/include/tinyxml2.h
      - test -f $PREFIX/lib/cmake/tinyxml2/tinyxml2-config.cmake
      - |
        if ! ls "$PREFIX"/lib/libtinyxml2.so* >/dev/null 2>&1; then
          echo "missing tinyxml2 shared library"
          exit 1
        fi
      - |
        cat > test_tinyxml2.cpp <<'EOF'
        #include <tinyxml2.h>
        int main() {
          tinyxml2::XMLDocument doc;
          return doc.Parse("<root/>") == tinyxml2::XML_SUCCESS ? 0 : 1;
        }
        EOF
      - $CXX -std=c++11 -I$PREFIX/include test_tinyxml2.cpp -L$PREFIX/lib -ltinyxml2 -Wl,-rpath,$PREFIX/lib -o test_tinyxml2
      - ./test_tinyxml2
    requirements:
      run:
        - gxx_linux-riscv64

about:
  homepage: https://github.com/leethomason/tinyxml2
  repository: https://github.com/leethomason/tinyxml2
  summary: Simple, small, efficient C++ XML parser
  license: Zlib
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - trdthg
