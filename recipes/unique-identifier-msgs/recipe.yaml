context:
  name: "unique-identifier-msgs"
  ros_name: "unique_identifier_msgs"
  version: "2.2.1"
  git_rev: "27767cefcf8a80da44641dc208c57722c28aa11c"
  source_dir: "."

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/ros2/unique_identifier_msgs.git
  rev: ${{ git_rev }}

build:
  number: 2
  script:
    - cd ${{ source_dir }}
    - |
      SITE_PACKAGES=$("$PREFIX/bin/python3.12" -c 'import os, sysconfig; print(sysconfig.get_path("purelib", scheme="posix_prefix", vars={"base": os.environ["PREFIX"], "platbase": os.environ["PREFIX"]}))')
      export PYTHONPATH="$SITE_PACKAGES${PYTHONPATH:+:$PYTHONPATH}"
    - $PREFIX/bin/cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPython3_EXECUTABLE="$PREFIX/bin/python3.12" -DPYTHON_EXECUTABLE="$PREFIX/bin/python3.12"
    - $PREFIX/bin/cmake --build build --target install -- -j"$(nproc)"
    - |
      "$PREFIX/bin/python3.12" - <<'PY'
      import os
      import re
      from pathlib import Path

      cmake_dir = Path(os.environ["PREFIX"]) / "share/unique_identifier_msgs/cmake"
      for path in cmake_dir.glob("*.cmake"):
          text = path.read_text()
          text = text.replace('/usr/lib/riscv64-linux-gnu/python3-numpy/numpy/_core/include', '${_IMPORT_PREFIX}/lib/python3.12/site-packages/numpy/_core/include')
          text = re.sub(r'[^;"]*host_env_placehold[^;"]*numpy[^;"]*', '${_IMPORT_PREFIX}/lib/python3.12/site-packages/numpy/_core/include', text)
          text = re.sub(r'/usr/lib/riscv64-linux-gnu/libpython[0-9.]*\.so', '${_IMPORT_PREFIX}/lib/libpython3.12.so', text)
          text = re.sub(r'[^;"]*host_env_placehold[^;"]*libpython[0-9.]*\.so', '${_IMPORT_PREFIX}/lib/libpython3.12.so', text)
          path.write_text(text)
      PY

requirements:
  build:
    - cmake
    - patchelf
  host:
    - ament-cmake
    - numpy
    - python
    - rosidl-default-generators
    - setuptools
  run:
    - ament-cmake
    - numpy
    - python
    - rosidl-default-runtime

# This recipe intentionally uses the host compiler on the native riscv runner.
# future requirements:
#   build:
#     - c-compiler
#     - cxx-compiler
#     - make
#   run:
#     - libstdcxx

tests:
  - script:
      - test -f $PREFIX/share/${{ ros_name }}/msg/UUID.msg
      - test -f $PREFIX/share/${{ ros_name }}/msg/UUID.idl
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/uuid.h
      - test -f $PREFIX/include/${{ ros_name }}/${{ ros_name }}/msg/uuid.hpp
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_generator_c.so
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_typesupport_c.so
      - test -f $PREFIX/lib/lib${{ ros_name }}__rosidl_typesupport_cpp.so
      - test -f $PREFIX/share/ament_index/resource_index/packages/${{ ros_name }}
      - test -f $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - grep -q 'msg/UUID.idl' $PREFIX/share/ament_index/resource_index/rosidl_interfaces/${{ ros_name }}
      - |
        if grep -R -E 'host_env_placehold|python3-numpy|/usr/lib/riscv64-linux-gnu/(python|libpython)|libpython3\.13' "$PREFIX/share/${{ ros_name }}/cmake"; then
          echo "${{ ros_name }} CMake exports contain system Python/numpy paths"
          exit 1
        fi
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.16)
        project(test_unique_identifier_msgs C CXX)
        find_package(unique_identifier_msgs REQUIRED)
        if(NOT "msg/UUID.idl" IN_LIST unique_identifier_msgs_IDL_FILES)
          message(FATAL_ERROR "missing UUID.idl")
        endif()
        EOF
      - $PREFIX/bin/cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - |
        cat > test_unique_identifier_msgs.cpp <<'EOF'
        #include <unique_identifier_msgs/msg/uuid.hpp>
        int main() {
          unique_identifier_msgs::msg::UUID msg;
          msg.uuid[0] = 42u;
          return msg.uuid[0] == 42u ? 0 : 1;
        }
        EOF
      - c++ -std=c++14 -I$PREFIX/include -I$PREFIX/include/${{ ros_name }} test_unique_identifier_msgs.cpp -o test_unique_identifier_msgs
      - ./test_unique_identifier_msgs

about:
  homepage: https://github.com/ros2/unique_identifier_msgs
  repository: https://github.com/ros2/unique_identifier_msgs
  summary: ROS 2 message for universally unique identifiers
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - trdthg
