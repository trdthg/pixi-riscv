context:
  name: "yaml"
  version: "0.2.5"

package:
  name: ${{ name }}
  version: ${{ version }}

build:
  number: 0
  script:
    - mkdir -p "$PREFIX/share/yaml/cmake" "$PREFIX/share/ament_index/resource_index/packages"
    - |
      cat > "$PREFIX/share/yaml/package.xml" <<'EOF'
      <?xml version="1.0"?>
      <package format="3">
        <name>yaml</name>
        <version>${{ version }}</version>
        <description>CMake shim for system libyaml.</description>
        <maintainer email="noreply@example.com">pixi-riscv</maintainer>
        <license>MIT</license>
        <export><build_type>cmake</build_type></export>
      </package>
      EOF
    - |
      cat > "$PREFIX/share/yaml/cmake/yamlConfig.cmake" <<'EOF'
      include_guard(GLOBAL)
      find_path(yaml_INCLUDE_DIR yaml.h)
      find_library(yaml_LIBRARY yaml)
      if(NOT yaml_INCLUDE_DIR OR NOT yaml_LIBRARY)
        message(FATAL_ERROR "system libyaml headers/library not found")
      endif()
      if(NOT TARGET yaml)
        add_library(yaml UNKNOWN IMPORTED)
        set_target_properties(yaml PROPERTIES
          IMPORTED_LOCATION "${yaml_LIBRARY}"
          INTERFACE_INCLUDE_DIRECTORIES "${yaml_INCLUDE_DIR}"
        )
      endif()
      set(yaml_FOUND TRUE)
      set(yaml_INCLUDE_DIRS "${yaml_INCLUDE_DIR}")
      set(yaml_LIBRARIES "${yaml_LIBRARY}")
      EOF
    - printf '%s\n' "$PREFIX" > "$PREFIX/share/ament_index/resource_index/packages/yaml"

# This bootstrap recipe intentionally uses the system libyaml available on the
# riscv runner. Enable these dependencies once the riscv channel has libyaml.
# requirements:
#   build:
#     - c-compiler
#   run:
#     - libyaml

tests:
  - script:
      - test -f $PREFIX/share/yaml/cmake/yamlConfig.cmake
      - |
        cat > CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(test_yaml C)
        find_package(yaml REQUIRED)
        add_executable(test_yaml test_yaml.c)
        target_include_directories(test_yaml PRIVATE ${yaml_INCLUDE_DIRS})
        target_link_libraries(test_yaml PRIVATE yaml)
        EOF
      - |
        cat > test_yaml.c <<'EOF'
        #include <yaml.h>
        int main(void) {
          yaml_parser_t parser;
          if (!yaml_parser_initialize(&parser)) {
            return 1;
          }
          yaml_parser_delete(&parser);
          return 0;
        }
        EOF
      - cmake -S . -B build -DCMAKE_PREFIX_PATH=$PREFIX
      - cmake --build build
      - ./build/test_yaml

about:
  homepage: https://pyyaml.org/wiki/LibYAML
  summary: CMake shim for system libyaml
  license: MIT

extra:
  recipe-maintainers:
    - trdthg
